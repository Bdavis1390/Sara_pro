cycle_id: ATIP-CYCLE-0001
status: PRE_REGISTERED
purpose: "Validate method behavior across known, partially constrained, undeciphered and synthetic corpora."

targets:
  - benchmark_id: ATIP-LINEARB-RETRO-001
    target:
      source_id: DAMOS
      stable_id: "PY Ta 641"
      witness_ref: "DĀMOS / authoritative Linear B corpus; exact witness transcription to be snapshotted before run"
      source_checksum: null
    epistemic_class: KNOWN_DECIPHERED
    contamination_class: C2_RETROSPECTIVE
    allowed_evidence:
      - sign inventory
      - layout
      - ideogram/logogram positions
      - non-target Linear B grammar
    forbidden_comparators:
      - target English translation during frozen reconstruction
    frozen_prediction:
      status: NOT_STARTED
      artifact_ref: null
      sha256: null
      timestamp: null
    claim_ceiling: CALIBRATION_ONLY

  - benchmark_id: ATIP-ENOCHIAN-HOLDOUT-001
    target:
      source_id: ENOCHIAN_PRIMARY
      stable_id: "one non-Key-1 Angelical Call selected after source snapshot"
      witness_ref: "Sloane MS 3191 primary-family transcription"
      source_checksum: null
    epistemic_class: PARTIALLY_CONSTRAINED
    contamination_class: C0_SESSION_BLIND
    allowed_evidence:
      - non-target-call lexicon
      - non-target recurrence statistics
      - manuscript provenance
      - candidate grammar induced from non-target Calls
    forbidden_comparators:
      - target English sense
      - modern target translation
    frozen_prediction:
      status: NOT_STARTED
      artifact_ref: null
      sha256: null
      timestamp: null
    claim_ceiling: SESSION_BLIND_HOLDOUT_RESULT

  - benchmark_id: ATIP-LINEARA-NEG-001
    target:
      source_id: SIGLA
      stable_id: "HT 13 or alternate SigLA holdout selected before analysis"
      witness_ref: "SigLA primary palaeographic/transcription layer"
      source_checksum: null
    epistemic_class: UNDECIPHERED
    contamination_class: C4_UNKNOWN
    allowed_evidence:
      - sign identity
      - position
      - repetition
      - palaeographic variants
      - layout
      - corpus frequencies
    forbidden_comparators:
      - any running English translation
      - language identification presented as established
    frozen_prediction:
      status: NOT_STARTED
      artifact_ref: null
      sha256: null
      timestamp: null
    claim_ceiling: STRUCTURE_ONLY_NO_TRANSLATION

  - benchmark_id: ATIP-SYNTHETIC-NULL-001
    target:
      source_id: SYNTHETIC
      stable_id: "seeded_markov_and_shuffle_controls"
      witness_ref: "generated by atip_harness.py"
      source_checksum: null
    epistemic_class: SYNTHETIC_NULL
    contamination_class: C0_SESSION_BLIND
    allowed_evidence:
      - generated sequence only
      - generation seed after prediction freeze where appropriate
    forbidden_comparators:
      - generator labels during blinded classification
    frozen_prediction:
      status: NOT_STARTED
      artifact_ref: null
      sha256: null
      timestamp: null
    claim_ceiling: NULL_MODEL_ONLY

global_null_models:
  - exact token-count shuffle
  - first-order Markov surrogate
  - layout-preserving permutation where applicable

global_reporting:
  - sign/token inventory
  - unigram entropy
  - conditional entropy
  - repeated ngrams
  - positional profile
  - segmentation hypotheses
  - unsupported semantic insertions
  - uncertainty calibration
  - null-model exceedance
  - contamination class
  - claim ceiling
