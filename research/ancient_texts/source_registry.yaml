# ATIP source registry — bootstrap lanes
# Exact endpoints, licenses and ingestion adapters must be verified before canonical ingest.

source_families:
  - id: MESOPOTAMIAN_CUNEIFORM
    targets: [Sumerian, Akkadian, Babylonian, Assyrian, Hurrian, Hittite, Ugaritic]
    preferred_authority_types: [primary_museum_catalog, scholarly_corpus, critical_edition]
    status: VERIFY_AND_ADAPT
  - id: EGYPTIAN
    targets: [hieroglyphic, hieratic, demotic]
    preferred_authority_types: [primary_museum_catalog, scholarly_corpus, encoded_sign_standard]
    status: VERIFY_AND_ADAPT
  - id: LEVANTINE_SEMITIC
    targets: [Phoenician, Hebrew, Aramaic, Moabite, Edomite, Ammonite, Ugaritic]
    preferred_authority_types: [critical_edition, manuscript_repository, epigraphic_database]
    status: VERIFY_AND_ADAPT
  - id: AEGEAN
    targets: [Linear_A, Linear_B, Cypro_Minoan, Cypriot_syllabic]
    preferred_authority_types: [scholarly_corpus, museum_repository]
    status: VERIFY_AND_ADAPT
  - id: GREEK
    targets: [archaic, classical, koine, papyri, inscriptions, literary_witnesses]
