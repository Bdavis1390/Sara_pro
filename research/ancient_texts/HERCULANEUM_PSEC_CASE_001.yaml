evidence_chain:
  - stage: ARTIFACT
    requirement: "Repository inventory / scroll identity"
  - stage: TOMOGRAPHY
    requirement: "Voxel volume + scan parameters"
  - stage: SURFACE_SEGMENTATION
    requirement: "Surface geometry + segmentation version"
  - stage: VIRTUAL_UNWRAP
    requirement: "Flattening transform + spatial mapping back to volume"
  - stage: INK_DETECTION
    requirement: "Ink probability/model version + training provenance"
  - stage: GLYPH_IMAGE
    requirement: "Rendered papyrus/ink patch"
  - stage: TRANSCRIPTION
    requirement: "Papyrologist-reviewed Greek transcription + uncertainty"
  - stage: TEXTUAL_RECONSTRUCTION
    requirement: "Columns/order/restorations/critical apparatus"
  - stage: TRANSLATION
    requirement: "Target language + alignment to exact transcription"
  - stage: INTERPRETATION
    requirement: "Argument/theme/authorship claims + evidence links"

claim_boundaries:
  supported:
    - "Complete-text recovery from sealed carbonized scrolls is now demonstrated."
    - "The recovery process is a multi-stage physical/computational/human pipeline."
  not_claimed:
    - "Every unopened scroll is currently readable."
    - "AI-generated ink detections are self-validating."
    - "Recovered translation is independent of segmentation/transcription uncertainty."
