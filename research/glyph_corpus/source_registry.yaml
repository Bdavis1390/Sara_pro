version: "0.1.0"
updated: "2026-09-17"
program: "Worldshepherd Global Glyph & Stela Corpus"
parent_issue: 378
methodology_issue: 377

policy:
  provenance_first: true
  default_media_action: "metadata_only_until_rights_verified"
  undeciphered_scripts: "do_not_assign_translation_without_specialist_source"
  inference_rule: "visual resemblance != shared origin != author intent != organizational affiliation != causal mechanism != quantitative relationship != proof"

sources:
  - id: unicode_unikemet
    name: "Unicode Egyptian Hieroglyph Database (Unikemet)"
    authority: "Unicode Consortium"
    domain: [egyptian, hieroglyphs, sign_catalog]
    url: "https://unicode.org/reports/tr57/"
    access: "UCD Unikemet.txt; structured UTF-8 properties"
    useful_fields: [codepoint, catalog_indexes, sources, description, function, core_status, mirroring, rotation]
    confidence: authoritative

  - id: cdli
    name: "Cuneiform Digital Library Initiative"
