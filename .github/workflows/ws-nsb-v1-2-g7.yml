name: WS-NSB v1.2 G7 Gate

on:
  pull_request:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g7_qs_anisotropic.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g7_cli.py'
      - 'deployments/sara_verified_local_v1/tests/test_nsb_g7_qs_anisotropic.py'
      - 'deployments/sara_verified_local_v1/docs/WS_NSB_V1_2_G7_ANISOTROPIC_QS.md'
      - 'deployments/sara_verified_local_v1/pyproject.toml'
      - '.github/workflows/ws-nsb-v1-2-g7.yml'
  push:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g7_qs_anisotropic.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g7_cli.py'
      - 'deployments/sara_verified_local_v1/tests/test_nsb_g7_qs_anisotropic.py'
      - 'deployments/sara_verified_local_v1/docs/WS_NSB_V1_2_G7_ANISOTROPIC_QS.md'
      - 'deployments/sara_verified_local_v1/pyproject.toml'
      - '.github/workflows/ws-nsb-v1-2-g7.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: deployments/sara_verified_local_v1

jobs:
  g7-anisotropic-qs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and tests
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -c constraints-ci.txt -e '.[test]'
          python -m pip check

      - name: Run G7 test suite
        run: python -m pytest tests/test_nsb_g7_qs_anisotropic.py -q

      - name: Execute and verify deterministic G7 report
        run: |
          rm -f ws_nsb_g7_report.json
          ws-nsb-g7 --output ws_nsb_g7_report.json
          ws-nsb-g7 --verify ws_nsb_g7_report.json

      - name: Upload G7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws-nsb-v1-2-g7-report
          path: deployments/sara_verified_local_v1/ws_nsb_g7_report.json
          if-no-files-found: error
