name: Worldshepherd Audit Offline Verifier

on:
  workflow_dispatch:
  push:
    branches:
      - worldshepherd-capture-engine-v1-1
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/audit_checkpoint.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/audit_checkpoint_anchor.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/audit_checkpoint_guarded.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/audit_checkpoint_offline_verify.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/audit_checkpoint_verify.py'
      - 'deployments/sara_verified_local_v1/tests/test_audit_checkpoint.py'
      - 'deployments/sara_verified_local_v1/tests/test_audit_checkpoint_anchor.py'
      - 'deployments/sara_verified_local_v1/tests/test_audit_checkpoint_guarded.py'
      - 'deployments/sara_verified_local_v1/tests/test_audit_checkpoint_offline_verify.py'
      - 'tools/selection_demo/audit_offline_verifier_demo.py'
      - '.github/workflows/worldshepherd-audit-offline-verifier.yml'

permissions:
  contents: read

jobs:
  offline-audit-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SARA test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'deployments/sara_verified_local_v1[test]'

      - name: Run checkpoint and offline-verifier regression tests
        run: |
          python -m pytest \
            deployments/sara_verified_local_v1/tests/test_audit_checkpoint.py \
            deployments/sara_verified_local_v1/tests/test_audit_checkpoint_anchor.py \
            deployments/sara_verified_local_v1/tests/test_audit_checkpoint_guarded.py \
            deployments/sara_verified_local_v1/tests/test_audit_checkpoint_offline_verify.py

      - name: Run cross-restart offline adversarial evidence gate
        run: |
          mkdir -p offline_audit_evidence
          python tools/selection_demo/audit_offline_verifier_demo.py \
            --out offline_audit_evidence/audit-offline-adversarial-evidence.json \
            --software-commit "$GITHUB_SHA"

      - name: Upload offline-verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldshepherd-audit-offline-verifier-${{ github.sha }}
          path: offline_audit_evidence/
          if-no-files-found: error
          retention-days: 30
