name: Marketplace Round 6 Validation

on:
  push:
    paths:
      - 'marketplace/market_scan_round6_20260903.json'
      - 'marketplace/validate_marketplace_round6.py'
      - '.github/workflows/marketplace-round6.yml'
  pull_request:
    paths:
      - 'marketplace/market_scan_round6_20260903.json'
      - 'marketplace/validate_marketplace_round6.py'
      - '.github/workflows/marketplace-round6.yml'

jobs:
  validate-round6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -m py_compile marketplace/validate_marketplace_round6.py
      - name: Validate registry
        run: python marketplace/validate_marketplace_round6.py --registry marketplace/market_scan_round6_20260903.json --output marketplace/evidence/marketplace-round6-report.json
      - name: Verify fail-closed state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('marketplace/evidence/marketplace-round6-report.json').read_text())
          assert r['result']=='PASS'
          assert r['target_count']==5
          assert r['active_solution_development_target_count']==5
          assert r['watch_only_target_count']==0
          assert len(r['high_priority_90_plus_ids'])==5
          assert r['new_contact_authorizations']==0
          assert r['default_contact_threshold_pct']==98.7
          assert r['default_precontact_cap_pct']==55.0
          print(json.dumps(r,indent=2))
          PY
      - name: Hash evidence
        run: |
          sha256sum marketplace/evidence/marketplace-round6-report.json > marketplace/evidence/MARKETPLACE_ROUND6_SHA256SUMS.txt
          cat marketplace/evidence/MARKETPLACE_ROUND6_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-round6-validation
          path: |
            marketplace/evidence/marketplace-round6-report.json
            marketplace/evidence/MARKETPLACE_ROUND6_SHA256SUMS.txt
          retention-days: 90
