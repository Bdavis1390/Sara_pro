name: QCRYPTO SPDX PQC Fixture Gate

on:
  pull_request:
    paths:
      - 'docs/qcrypto/spdx-pqc/**'
      - 'scripts/validate_spdx_pqc_fixtures.py'
      - '.github/workflows/qcrypto-spdx-pqc-fixture-gate.yml'
  push:
    paths:
      - 'docs/qcrypto/spdx-pqc/**'
      - 'scripts/validate_spdx_pqc_fixtures.py'
      - '.github/workflows/qcrypto-spdx-pqc-fixture-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install bounded validator dependency
        run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Compile validator and tests
        run: python -m compileall -q scripts/validate_spdx_pqc_fixtures.py docs/qcrypto/spdx-pqc/tests
      - name: Validate authoritative proposal fixtures
        run: python scripts/validate_spdx_pqc_fixtures.py
      - name: Run negative-control tests
        run: python docs/qcrypto/spdx-pqc/tests/test_validate_fixtures.py
