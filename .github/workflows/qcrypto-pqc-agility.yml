name: QCRYPTO PQC Agility Gate

on:
  pull_request:
    paths:
      - 'security/qcrypto/pqc_algorithm_policy.py'
      - 'scripts/qcrypto_pqc_agility_evidence.py'
      - 'tests/test_qcrypto_pqc_algorithm_policy.py'
      - '.github/workflows/qcrypto-pqc-agility.yml'
  push:
    branches:
      - worldshepherd-qcrypto-width-time-risk-v1
    paths:
      - 'security/qcrypto/pqc_algorithm_policy.py'
      - 'scripts/qcrypto_pqc_agility_evidence.py'
      - 'tests/test_qcrypto_pqc_algorithm_policy.py'
      - '.github/workflows/qcrypto-pqc-agility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pqc-agility:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile agility policy and evidence generator
        run: |
          python -m compileall \
            security/qcrypto/pqc_algorithm_policy.py \
            scripts/qcrypto_pqc_agility_evidence.py

      - name: Run PQC lifecycle policy regressions
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_qcrypto_pqc_algorithm_policy.py

      - name: Generate machine-readable PQC agility evidence
        env:
          PYTHONPATH: .
        run: python scripts/qcrypto_pqc_agility_evidence.py --output pqc-agility-evidence.json

      - name: Assert fail-closed standards and deployment posture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence=json.loads(Path('pqc-agility-evidence.json').read_text(encoding='utf-8'))
          assert evidence['schema']=='WS-PQC-AGILITY-POLICY-EVIDENCE-V1'
          assert evidence['status']=='PASS'
          assert set(evidence['summary']['final_fips_pq_algorithms'])=={'ML-KEM','ML-DSA','SLH-DSA'}
          assert evidence['registry']['FN-DSA']['standardization_state']=='FIPS_IN_DEVELOPMENT'
          assert evidence['registry']['HQC']['standardization_state']=='SELECTED_FOR_STANDARDIZATION'
          assert evidence['registry']['HAWK']['standardization_state']=='WITHDRAWN'
          assert evidence['scenarios']['ML_DSA_CONSENSUS_INTERNAL_SUPPORT_ONLY']['verdict']=='BLOCKED_DEPLOYMENT_EVIDENCE'
          assert evidence['scenarios']['FN_DSA_PRODUCTION_SIGNATURE']['deployment_eligible'] is False
          assert evidence['scenarios']['HQC_PRODUCTION_KEY_ESTABLISHMENT']['deployment_eligible'] is False
          assert evidence['scenarios']['HAWK_PRODUCTION_SIGNATURE']['deployment_eligible'] is False
          assert evidence['scenarios']['ML_KEM_STALE_POLICY_EVIDENCE']['deployment_eligible'] is False
          assert evidence['scenarios']['UNKNOWN_PQC_PRODUCTION_SIGNATURE']['deployment_eligible'] is False
          assert evidence['summary']['production_pq_consensus_ready'] is False
          assert evidence['summary']['fips_module_validation_established'] is False
          assert evidence['summary']['federal_compliance_established'] is False
          assert evidence['summary']['end_to_end_pq_security_established'] is False
          assert len(evidence['evidence_sha256'])==64
          print('pqc_agility_status: PASS')
          print('eligible:', evidence['summary']['production_integration_review_eligible_scenarios'])
          print('evidence_sha256:', evidence['evidence_sha256'])
          PY

      - name: Upload PQC agility evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws-pqc-agility-policy-evidence
          path: pqc-agility-evidence.json
          if-no-files-found: error
