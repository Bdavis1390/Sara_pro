name: WS-MARKET v0.2

on:
  pull_request:
    paths:
      - "research/ws_market_v0_2/**"
      - "tests/test_ws_market_v0_2.py"
      - ".github/workflows/ws-market-v0_2.yml"
  push:
    branches:
      - main
    paths:
      - "research/ws_market_v0_2/**"
      - "tests/test_ws_market_v0_2.py"
      - ".github/workflows/ws-market-v0_2.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run WS-MARKET v0.2 bounded unit tests
        run: python -m unittest tests.test_ws_market_v0_2 -v
      - name: Reject whitespace errors
        run: git diff --check HEAD^ -- . || git diff --check
