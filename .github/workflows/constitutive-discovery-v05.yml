name: Constitutive Discovery v0.5 Gate
on:
  pull_request:
    paths: ["research/constitutive_discovery_v05/**", ".github/workflows/constitutive-discovery-v05.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pytest -q research/constitutive_discovery_v05/test_engine.py
