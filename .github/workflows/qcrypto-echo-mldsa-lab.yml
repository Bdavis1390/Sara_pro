name: QCRYPTO ECHO ML-DSA Lab Gate

on:
  pull_request:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/echo_checkpoint_mldsa_lab.py'
      - 'deployments/sara_verified_local_v1/tests/test_echo_checkpoint_mldsa_lab.py'
      - 'scripts/qcrypto_echo_mldsa_lab_evidence.py'
      - '.github/workflows/qcrypto-echo-mldsa-lab.yml'
  push:
    branches:
      - worldshepherd-qcrypto-width-time-risk-v1
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/echo_checkpoint_mldsa_lab.py'
      - 'deployments/sara_verified_local_v1/tests/test_echo_checkpoint_mldsa_lab.py'
      - 'scripts/qcrypto_echo_mldsa_lab_evidence.py'
      - '.github/workflows/qcrypto-echo-mldsa-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mldsa65-controlled-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENSSL_VERSION_PIN: '3.5.8'
      OPENSSL_SOURCE_SHA256: 'a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2'

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SARA test environment
        working-directory: deployments/sara_verified_local_v1
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -c constraints-ci.txt -e '.[test]'
          python -m pip check

      - name: Build pinned OpenSSL 3.5 LTS lab provider
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/openssl-${OPENSSL_VERSION_PIN}.tar.gz"
          source_dir="$RUNNER_TEMP/openssl-${OPENSSL_VERSION_PIN}"
          prefix="$RUNNER_TEMP/openssl-${OPENSSL_VERSION_PIN}-lab"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION_PIN}/openssl-${OPENSSL_VERSION_PIN}.tar.gz"
          printf '%s  %s\n' "$OPENSSL_SOURCE_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cd "$source_dir"
          ./Configure \
            --prefix="$prefix" \
            --openssldir="$prefix/ssl" \
            no-shared
          make -j2 build_sw
          make install_sw
          test -x "$prefix/bin/openssl"
          "$prefix/bin/openssl" version -v
          "$prefix/bin/openssl" list -signature-algorithms | grep -F 'ML-DSA-65'
          echo "WS_OPENSSL35_BIN=$prefix/bin/openssl" >> "$GITHUB_ENV"

      - name: Generate ephemeral ML-DSA-65 lab key
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ws-echo-mldsa65-lab.pem"
          "$WS_OPENSSL35_BIN" genpkey -algorithm ML-DSA-65 -out "$key"
          chmod 600 "$key"
          "$WS_OPENSSL35_BIN" pkey -in "$key" -check -noout
          echo "WS_MLDSA65_KEY=$key" >> "$GITHUB_ENV"

      - name: Compile lab adapter and evidence generator
        run: |
          python -m compileall \
            deployments/sara_verified_local_v1/worldshepherd_sara/echo_checkpoint_mldsa_lab.py \
            scripts/qcrypto_echo_mldsa_lab_evidence.py

      - name: Run real ML-DSA-65 interoperability regressions
        run: |
          pytest -q deployments/sara_verified_local_v1/tests/test_echo_checkpoint_mldsa_lab.py

      - name: Generate controlled-lab evidence
        run: |
          python scripts/qcrypto_echo_mldsa_lab_evidence.py \
            --openssl "$WS_OPENSSL35_BIN" \
            --private-key "$WS_MLDSA65_KEY" \
            --output echo-mldsa65-lab-evidence.json

      - name: Assert bounded real-PQ evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          e=json.loads(Path('echo-mldsa65-lab-evidence.json').read_text(encoding='utf-8'))
          assert e['schema']=='WS-ECHO-MLDSA65-CONTROLLED-LAB-EVIDENCE-V1'
          assert e['status']=='PASS'
          x=e['exercise']
          assert x['algorithm']=='ML-DSA-65'
          assert x['openssl_version'].startswith('OpenSSL 3.5.8')
          assert x['context_string']=='WS-ECHO-CHECKPOINT-V1'
          assert x['verified'] is True
          assert x['tamper_rejected'] is True
          assert x['production_authorized'] is False
          assert x['fips_module_validation_established'] is False
          assert e['private_key_in_artifact'] is False
          assert e['runtime_integration_enabled'] is False
          assert e['production_checkpoint_signing_ready'] is False
          assert e['end_to_end_pq_security_established'] is False
          assert len(x['public_key_der_sha256'])==64
          assert len(x['payload_sha256'])==64
          assert len(e['evidence_sha256'])==64
          print('echo_mldsa65_controlled_lab_status: PASS')
          print('openssl_version:', x['openssl_version'])
          print('signature_length:', x['signature_length'])
          print('public_key_der_sha256:', x['public_key_der_sha256'])
          print('evidence_sha256:', e['evidence_sha256'])
          PY

      - name: Remove ephemeral private key before artifact upload
        if: always()
        shell: bash
        run: |
          if [[ -n "${WS_MLDSA65_KEY:-}" && -f "$WS_MLDSA65_KEY" ]]; then
            rm -f "$WS_MLDSA65_KEY"
          fi

      - name: Upload ML-DSA controlled-lab evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws-echo-mldsa65-controlled-lab-evidence
          path: echo-mldsa65-lab-evidence.json
          if-no-files-found: error
