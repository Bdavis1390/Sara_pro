name: WS-NSB v1.0 G5 Gate

on:
  pull_request:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g5_hartmann.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g5_cli.py'
      - 'deployments/sara_verified_local_v1/tests/test_nsb_g5_hartmann.py'
      - 'deployments/sara_verified_local_v1/docs/WS_NSB_V1_0_G5_HARTMANN.md'
      - 'deployments/sara_verified_local_v1/pyproject.toml'
      - '.github/workflows/ws-nsb-v1-0-g5.yml'
  push:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g5_hartmann.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g5_cli.py'
      - 'deployments/sara_verified_local_v1/tests/test_nsb_g5_hartmann.py'
      - 'deployments/sara_verified_local_v1/docs/WS_NSB_V1_0_G5_HARTMANN.md'
      - 'deployments/sara_verified_local_v1/pyproject.toml'
      - '.github/workflows/ws-nsb-v1-0-g5.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: deployments/sara_verified_local_v1

jobs:
  g5-hartmann-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and tests
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -c constraints-ci.txt -e '.[test]'
          python -m pip check

      - name: Run G5 test suite
        run: python -m pytest tests/test_nsb_g5_hartmann.py -q

      - name: Execute and verify deterministic G5 report
        run: |
          rm -f ws_nsb_g5_report.json
          ws-nsb-g5 --output ws_nsb_g5_report.json
          ws-nsb-g5 --verify ws_nsb_g5_report.json

      - name: Upload G5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws-nsb-v1-0-g5-report
          path: deployments/sara_verified_local_v1/ws_nsb_g5_report.json
          if-no-files-found: error
