name: WS-SDA 10x Benchmark G9

on:
  pull_request:
    paths:
      - "deployments/sara_verified_local_v1/worldshepherd_sara/sda_10x_benchmark.py"
      - "deployments/sara_verified_local_v1/tests/test_sda_10x_benchmark.py"
      - "deployments/sara_verified_local_v1/fixtures/ws_sda_g9_benchmark_protocol_v1.json"
      - "deployments/sara_verified_local_v1/fixtures/ws_sda_g8_adversarial_corpus_v1.json"
      - "docs/WS_SDA_10X_G9_2026-09-18.md"
      - ".github/workflows/ws-sda-10x-g9.yml"
  push:
    branches:
      - main
    paths:
      - "deployments/sara_verified_local_v1/worldshepherd_sara/sda_10x_benchmark.py"
      - "deployments/sara_verified_local_v1/tests/test_sda_10x_benchmark.py"
      - "deployments/sara_verified_local_v1/fixtures/ws_sda_g9_benchmark_protocol_v1.json"
      - "deployments/sara_verified_local_v1/fixtures/ws_sda_g8_adversarial_corpus_v1.json"
      - "docs/WS_SDA_10X_G9_2026-09-18.md"
      - ".github/workflows/ws-sda-10x-g9.yml"

permissions:
  contents: read

jobs:
  g9-protocol:
    name: sda-g9-benchmark-protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install canonical SARA test dependencies
        working-directory: deployments/sara_verified_local_v1
        run: python -m pip install -e '.[test]'

      - name: Validate G8 corpus digest against frozen G9 protocol
        working-directory: deployments/sara_verified_local_v1
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          corpus = Path("fixtures/ws_sda_g8_adversarial_corpus_v1.json")
          protocol = json.loads(
              Path("fixtures/ws_sda_g9_benchmark_protocol_v1.json").read_text(
                  encoding="utf-8"
              )
          )
          observed = "sha256:" + hashlib.sha256(corpus.read_bytes()).hexdigest()
          assert protocol["schema"] == "WS-SDA-G9-BENCHMARK-PROTOCOL-V1"
          assert observed == protocol["g8_corpus_sha256"], (
              f"G8 workload digest changed: observed={observed} "
              f"expected={protocol['g8_corpus_sha256']}"
          )
          PY

      - name: Run G9 evaluator semantics
        working-directory: deployments/sara_verified_local_v1
        run: python -m pytest -q tests/test_sda_10x_benchmark.py

      - name: Emit protocol-readiness evidence
        working-directory: deployments/sara_verified_local_v1
        env:
          TESTED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema": "WS-SDA-G9-PROTOCOL-READINESS-V1",
              "tested_commit": os.environ["TESTED_COMMIT"],
              "state": "PROTOCOL_FROZEN_EVALUATOR_IMPLEMENTED",
              "ten_x_claim_eligible": False,
              "reason": (
                  "Real comparable baseline and candidate measurement bundles "
                  "have not yet been supplied to the frozen evaluator."
              ),
              "claims_boundary": (
                  "This artifact proves protocol/evaluator readiness only. "
                  "Synthetic unit-test bundles are not real 10x evidence."
              ),
          }
          Path("sda-g9-protocol-readiness.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload G9 protocol evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws-sda-g9-protocol-readiness
          path: |
            deployments/sara_verified_local_v1/sda-g9-protocol-readiness.json
            deployments/sara_verified_local_v1/fixtures/ws_sda_g9_benchmark_protocol_v1.json
          if-no-files-found: error
          retention-days: 90
