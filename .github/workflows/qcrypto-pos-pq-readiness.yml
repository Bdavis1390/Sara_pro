name: QCRYPTO PoS PQ Readiness Gate

on:
  pull_request:
    paths:
      - "security/qcrypto/pos_family_preservation.py"
      - "security/qcrypto/pos_pq_benchmarks.py"
      - "security/qcrypto/pos_pq_readiness.py"
      - "scripts/qcrypto_pos_pq_readiness_evidence.py"
      - "tests/test_qcrypto_pos_pq_readiness.py"
      - ".github/workflows/qcrypto-pos-pq-readiness.yml"
  push:
    branches:
      - worldshepherd-qcrypto-width-time-risk-v1
    paths:
      - "security/qcrypto/pos_family_preservation.py"
      - "security/qcrypto/pos_pq_benchmarks.py"
      - "security/qcrypto/pos_pq_readiness.py"
      - "scripts/qcrypto_pos_pq_readiness_evidence.py"
      - "tests/test_qcrypto_pos_pq_readiness.py"
      - ".github/workflows/qcrypto-pos-pq-readiness.yml"

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile PQ readiness classifier
        run: python -m compileall security/qcrypto/pos_pq_readiness.py scripts/qcrypto_pos_pq_readiness_evidence.py

      - name: Run fail-closed readiness regressions
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_qcrypto_pos_pq_readiness.py

      - name: Generate machine-readable readiness evidence
        env:
          PYTHONPATH: .
        run: python scripts/qcrypto_pos_pq_readiness_evidence.py --output qpos-pq-readiness.json

      - name: Assert no unsupported production-PQ promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("qpos-pq-readiness.json").read_text())
          assert evidence["schema"] == "WS-QPOS-PQ-READINESS-V1"
          assert evidence["status"] == "PASS"
          assert evidence["target_count"] == 19
          assert evidence["benchmark_count"] == 1
          assert len(evidence["required_axes"]) == 7
          assert evidence["production_ready_target_count"] == 0
          assert evidence["production_ready_benchmark_count"] == 0
          assert evidence["targets"]["ALGORAND"]["classification"] == "PRODUCTION_PQ_COMPONENT_ONLY"
          assert evidence["targets"]["ETHEREUM"]["classification"] == "PQ_TRANSITION_IN_EXTERNAL_DEVELOPMENT"
          assert evidence["benchmarks"]["QRL2_TESTNET"]["classification"] == "PUBLIC_PQ_VALIDATOR_AUTH_TESTNET"
          assert evidence["warranted_summary"]["production_pq_consensus_ready"] is False
          assert len(evidence["evidence_sha256"]) == 64
          print("readiness_status: PASS")
          print("production_ready_target_count:", evidence["production_ready_target_count"])
          print("qrl_classification:", evidence["benchmarks"]["QRL2_TESTNET"]["classification"])
          print("evidence_sha256:", evidence["evidence_sha256"])
          PY

      - name: Upload PQ readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: ws-qpos-pq-readiness
          path: qpos-pq-readiness.json
          if-no-files-found: error
