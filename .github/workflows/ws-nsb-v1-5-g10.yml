name: WS-NSB v1.5 G10 Gate

on:
  pull_request:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g10_nonlinear_mhd.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g10_cli.py'
      - 'deployments/sara_verified_local_v1/tests/test_nsb_g10_nonlinear_mhd.py'
      - 'deployments/sara_verified_local_v1/docs/WS_NSB_V1_5_G10_NONLINEAR_2D_MHD.md'
      - 'deployments/sara_verified_local_v1/pyproject.toml'
      - '.github/workflows/ws-nsb-v1-5-g10.yml'
  push:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g10_nonlinear_mhd.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g10_cli.py'
      - 'deployments/sara_verified_local_v1/tests/test_nsb_g10_nonlinear_mhd.py'
      - 'deployments/sara_verified_local_v1/docs/WS_NSB_V1_5_G10_NONLINEAR_2D_MHD.md'
      - 'deployments/sara_verified_local_v1/pyproject.toml'
      - '.github/workflows/ws-nsb-v1-5-g10.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: deployments/sara_verified_local_v1

jobs:
  g10-nonlinear-2d-mhd:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and tests
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -c constraints-ci.txt -e '.[test]'
          python -m pip check

      - name: Run G10 test suite
        run: python -m pytest tests/test_nsb_g10_nonlinear_mhd.py -q

      - name: Execute and verify deterministic G10 report
        run: |
          rm -f ws_nsb_g10_report.json
          ws-nsb-g10 --output ws_nsb_g10_report.json
          ws-nsb-g10 --verify ws_nsb_g10_report.json

      - name: Upload G10 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws-nsb-v1-5-g10-report
          path: deployments/sara_verified_local_v1/ws_nsb_g10_report.json
          if-no-files-found: error
