name: SARA Verified Local v1 Gate

on:
  pull_request:
    paths:
      - 'deployments/sara_verified_local_v1/**'
      - '.github/workflows/sara-verified-local-v1.yml'
  push:
    paths:
      - 'deployments/sara_verified_local_v1/**'
      - '.github/workflows/sara-verified-local-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: deployments/sara_verified_local_v1

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned package and test dependencies
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -c constraints-ci.txt -e '.[test]'
          python -m pip check
          python -m pip freeze --all | sort > dependency-freeze.txt
          command -v ws-pre-bloom
          command -v ws-sbom-evidence
          command -v ws-vulnerability-evidence
          command -v ws-human-triage-ledger
          command -v ws-intake-minimum-ledger
          command -v ws-partner-screening
          command -v ws-partner-screening-batch
          command -v ws-partner-screening-verify
          command -v ws-release-index
          command -v ws-release-index-link-intake
          ws-pre-bloom --help >/dev/null
          ws-sbom-evidence --help >/dev/null
          ws-vulnerability-evidence --help >/dev/null
          ws-human-triage-ledger --help >/dev/null
          ws-intake-minimum-ledger --help >/dev/null
          ws-partner-screening --help >/dev/null
          ws-partner-screening-batch --help >/dev/null
          ws-partner-screening-verify --help >/dev/null
          ws-release-index --help >/dev/null
          ws-release-index-link-intake --help >/dev/null
          bash scripts/verify_partner_screening_artifact.sh --help >/dev/null

      - name: Upload dependency resolution evidence
        uses: actions/upload-artifact@v4
        with:
          name: sara-dependency-freeze-evidence
          path: deployments/sara_verified_local_v1/dependency-freeze.txt
          if-no-files-found: error

      - name: Build software SBOM evidence
        run: |
          rm -rf sbom_evidence_ci
          ws-sbom-evidence \
            --dependency-freeze dependency-freeze.txt \
            --pyproject pyproject.toml \
            --runtime-constraints constraints-runtime.txt \
            --ci-constraints constraints-ci.txt \
            --out sbom_evidence_ci \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --executed-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --operator "github-actions"
          test -s sbom_evidence_ci/software-sbom.json
          test -s sbom_evidence_ci/sbom-evidence-summary.json
          python -m json.tool sbom_evidence_ci/software-sbom.json >/dev/null
          python -m json.tool sbom_evidence_ci/sbom-evidence-summary.json >/dev/null
          python - <<'PY'
          import json
          summary=json.load(open('sbom_evidence_ci/sbom-evidence-summary.json', encoding='utf-8'))
          assert summary['schema'] == 'WS-SOFTWARE-SUPPLY-CHAIN-EVIDENCE-V1'
          assert summary['evidence_status'] == 'INTERNAL_CI_GENERATED_UNSIGNED'
          assert summary['component_count'] > 0
          assert summary['software_sbom_sha256'].startswith('sha256:')
          assert 'does not establish' in summary['claims_boundary']
          PY

      - name: Upload software SBOM evidence
        id: upload_software_sbom_evidence
        uses: actions/upload-artifact@v4
        with:
          name: software-sbom-evidence
          path: deployments/sara_verified_local_v1/sbom_evidence_ci
          if-no-files-found: error

      - name: Build vulnerability advisory evidence
        run: |
          rm -rf vulnerability_evidence_ci
          ws-vulnerability-evidence \
            --dependency-freeze dependency-freeze.txt \
            --sbom sbom_evidence_ci/software-sbom.json \
            --out vulnerability_evidence_ci \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --executed-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --operator "github-actions"
          test -s vulnerability_evidence_ci/vulnerability-advisory-report.json
          test -s vulnerability_evidence_ci/vulnerability-evidence-summary.json
          python -m json.tool vulnerability_evidence_ci/vulnerability-advisory-report.json >/dev/null
          python -m json.tool vulnerability_evidence_ci/vulnerability-evidence-summary.json >/dev/null
          python - <<'PY'
          import json
          summary=json.load(open('vulnerability_evidence_ci/vulnerability-evidence-summary.json', encoding='utf-8'))
          assert summary['schema'] == 'WS-VULNERABILITY-ADVISORY-EVIDENCE-V1'
          assert summary['evidence_status'] == 'INTERNAL_CI_GENERATED_UNSIGNED'
          assert summary['component_count'] > 0
          assert summary['advisory_record_count'] >= 0
          assert summary['vulnerability_report_sha256'].startswith('sha256:')
          assert 'does not establish absence of vulnerabilities' in summary['claims_boundary']
          PY

      - name: Upload vulnerability advisory evidence
        id: upload_vulnerability_evidence
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-advisory-evidence
          path: deployments/sara_verified_local_v1/vulnerability_evidence_ci
          if-no-files-found: error

      - name: Build human-review triage ledger evidence
        run: |
          rm -rf human_triage_ci
          ws-human-triage-ledger \
            --vulnerability-report vulnerability_evidence_ci/vulnerability-advisory-report.json \
            --vulnerability-summary vulnerability_evidence_ci/vulnerability-evidence-summary.json \
            --out human_triage_ci \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --executed-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --operator "github-actions"
          test -s human_triage_ci/human-triage-ledger.json
          test -s human_triage_ci/human-triage-summary.json
          python -m json.tool human_triage_ci/human-triage-ledger.json >/dev/null
          python -m json.tool human_triage_ci/human-triage-summary.json >/dev/null
          python - <<'PY'
          import json
          summary=json.load(open('human_triage_ci/human-triage-summary.json', encoding='utf-8'))
          assert summary['schema'] == 'WS-VULNERABILITY-HUMAN-TRIAGE-LEDGER-V1'
          assert summary['evidence_status'] == 'INTERNAL_REVIEW_LEDGER_UNSIGNED'
          assert summary['ledger_record_count'] >= 0
          assert summary['human_review_required_count'] >= 0
          assert summary['human_triage_ledger_sha256'].startswith('sha256:')
          assert 'does not establish absence of vulnerabilities' in summary['claims_boundary']
          assert 'remediation completion' in summary['claims_boundary']
          PY

      - name: Upload human-review triage ledger evidence
        id: upload_human_triage_evidence
        uses: actions/upload-artifact@v4
        with:
          name: human-triage-ledger-evidence
          path: deployments/sara_verified_local_v1/human_triage_ci
          if-no-files-found: error

      - name: Build intake minimum standard evidence
        run: |
          rm -rf intake_minimum_ci
          ws-intake-minimum-ledger \
            --intake-file fixtures/intake_minimum_standard.json \
            --out intake_minimum_ci \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --executed-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --operator "github-actions"
          test -s intake_minimum_ci/intake-minimum-ledger.json
          test -s intake_minimum_ci/intake-minimum-summary.json
          python -m json.tool intake_minimum_ci/intake-minimum-ledger.json >/dev/null
          python -m json.tool intake_minimum_ci/intake-minimum-summary.json >/dev/null
          python - <<'PY'
          import json
          summary=json.load(open('intake_minimum_ci/intake-minimum-summary.json', encoding='utf-8'))
          assert summary['schema'] == 'WS-INTAKE-MINIMUM-STANDARD-LEDGER-V1'
          assert summary['evidence_status'] == 'INTERNAL_INTAKE_STANDARD_UNSIGNED'
          assert summary['intake_count'] > 0
          assert summary['intake_minimum_ledger_sha256'].startswith('sha256:')
          assert summary['intake_minimum_ledger_file_sha256'].startswith('sha256:')
          assert 'does not establish' in summary['claims_boundary']
          assert 'award probability' in summary['claims_boundary']
          PY
          bash scripts/verify_intake_minimum_artifact.sh intake_minimum_ci >/dev/null

      - name: Upload intake minimum standard evidence
        id: upload_intake_minimum_evidence
        uses: actions/upload-artifact@v4
        with:
          name: intake-minimum-standard-evidence
          path: deployments/sara_verified_local_v1/intake_minimum_ci
          if-no-files-found: error

      - name: Validate operations policy
        run: |
          python -m json.tool ops_policy.json >/dev/null
          test -s docs/OPERATIONS.md

      - name: Compile package
        run: python -m compileall -q worldshepherd_sara

      - name: Run unit and API tests
        run: pytest

      - name: Compile PRE full-bloom qualification evidence
        run: |
          rm -rf qualification_evidence_ci
          ws-pre-bloom \
            --fixtures fixtures \
            --out qualification_evidence_ci \
            --software-commit "$GITHUB_SHA" \
            --executed-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --operator "github-actions"
          test -s qualification_evidence_ci/qualification_index.json
          test -s qualification_evidence_ci/capability_readiness_ledger.json
          test -s qualification_evidence_ci/capability_horizons.json
          test -s qualification_evidence_ci/software_provenance.json
          test -d qualification_evidence_ci/echo_store

      - name: Export partner-screening package evidence
        run: |
          rm -rf partner_screening_ci
          ws-partner-screening-batch \
            --bundle-dir qualification_evidence_ci \
            --out partner_screening_ci \
            --partner BAE_SYSTEMS \
            --partner GENERIC_PRIME
          test -s partner_screening_ci/batch-manifest.json
          python - <<'PY'
          import json
          import pathlib

          root = pathlib.Path('partner_screening_ci')
          manifest = json.loads((root / 'batch-manifest.json').read_text())
          assert manifest['schema'] == 'WS-PARTNER-SCREENING-BATCH-MANIFEST-V1'
          assert set(manifest['partners']) == {'BAE_SYSTEMS', 'GENERIC_PRIME'}
          assert manifest['source_bundle_count'] > 0
          assert manifest['package_count'] == manifest['source_bundle_count'] * len(manifest['partners'])
          assert manifest['batch_digest'].startswith('sha256:')
          for record in manifest['exports']:
              package_dir = pathlib.Path(record['output_dir'])
              assert package_dir.is_dir()
              assert (package_dir / 'manifest.json').is_file()
              assert (package_dir / 'qualification-summary.json').is_file()
              assert (package_dir / 'claims-boundary.md').is_file()
          text = '\n'.join(path.read_text() for path in root.rglob('*') if path.is_file())
          for forbidden in ('PARTNER_VALIDATED', 'SUPPLIER_APPROVED', 'FIELD_VALIDATED', 'CMMC_CERTIFIED'):
              assert forbidden not in text
          PY
          ws-partner-screening-verify --batch partner_screening_ci >/dev/null
          bash scripts/verify_partner_screening_artifact.sh partner_screening_ci >/dev/null

      - name: Upload PRE qualification evidence
        id: upload_pre_qualification_evidence
        uses: actions/upload-artifact@v4
        with:
          name: pre-full-bloom-qualification-evidence
          path: deployments/sara_verified_local_v1/qualification_evidence_ci
          if-no-files-found: error

      - name: Upload partner-screening package evidence
        id: upload_partner_screening_evidence
        uses: actions/upload-artifact@v4
        with:
          name: partner-screening-batch-evidence
          path: deployments/sara_verified_local_v1/partner_screening_ci
          if-no-files-found: error

      - name: Create ephemeral CI environment
        run: |
          printf 'SARA_RELAY_TOKEN=%s\nSARA_ADMIN_TOKEN=%s\nSARA_PORT=9530\nSARA_HOST_PORT=19530\nSARA_BUILD_COMMIT=%s\nSARA_RELEASE_ID=%s\n' \
            "$(openssl rand -hex 32)" \
            "$(openssl rand -hex 32)" \
            "$GITHUB_SHA" \
            "ci-${GITHUB_SHA}" > .env
          chmod 600 .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Run patched deployment verifier
        run: scripts/verify_deployment.sh

      - name: Run destructive backup and restore exercise
        run: bash scripts/recovery_exercise.sh

      - name: Capture operational snapshot after recovery
        run: bash scripts/ops_snapshot.sh

      - name: Verify observable release identity
        run: |
          python - <<'PY'
          import json, pathlib, os
          record=json.loads(pathlib.Path('operations_evidence/snapshot.json').read_text())
          identity=record['release_identity']
          assert identity['build_commit'] == os.environ['GITHUB_SHA']
          assert identity['release_id'] == 'ci-' + os.environ['GITHUB_SHA']
          PY

      - name: Upload recovery evidence
        id: upload_recovery_evidence
        uses: actions/upload-artifact@v4
        with:
          name: sara-recovery-exercise-evidence
          path: deployments/sara_verified_local_v1/recovery_evidence
          if-no-files-found: error

      - name: Upload operational snapshot evidence
        id: upload_operational_snapshot_evidence
        uses: actions/upload-artifact@v4
        with:
          name: sara-operational-snapshot-evidence
          path: deployments/sara_verified_local_v1/operations_evidence
          if-no-files-found: error

      - name: Build release evidence index
        env:
          SBOM_ARTIFACT_ID: ${{ steps.upload_software_sbom_evidence.outputs.artifact-id }}
          SBOM_ARTIFACT_DIGEST: ${{ steps.upload_software_sbom_evidence.outputs.artifact-digest }}
          SBOM_ARTIFACT_URL: ${{ steps.upload_software_sbom_evidence.outputs.artifact-url }}
          VULNERABILITY_ARTIFACT_ID: ${{ steps.upload_vulnerability_evidence.outputs.artifact-id }}
          VULNERABILITY_ARTIFACT_DIGEST: ${{ steps.upload_vulnerability_evidence.outputs.artifact-digest }}
          VULNERABILITY_ARTIFACT_URL: ${{ steps.upload_vulnerability_evidence.outputs.artifact-url }}
          HUMAN_TRIAGE_ARTIFACT_ID: ${{ steps.upload_human_triage_evidence.outputs.artifact-id }}
          HUMAN_TRIAGE_ARTIFACT_DIGEST: ${{ steps.upload_human_triage_evidence.outputs.artifact-digest }}
          HUMAN_TRIAGE_ARTIFACT_URL: ${{ steps.upload_human_triage_evidence.outputs.artifact-url }}
          INTAKE_ARTIFACT_ID: ${{ steps.upload_intake_minimum_evidence.outputs.artifact-id }}
          INTAKE_ARTIFACT_DIGEST: ${{ steps.upload_intake_minimum_evidence.outputs.artifact-digest }}
          INTAKE_ARTIFACT_URL: ${{ steps.upload_intake_minimum_evidence.outputs.artifact-url }}
          PRE_ARTIFACT_ID: ${{ steps.upload_pre_qualification_evidence.outputs.artifact-id }}
          PRE_ARTIFACT_DIGEST: ${{ steps.upload_pre_qualification_evidence.outputs.artifact-digest }}
          PRE_ARTIFACT_URL: ${{ steps.upload_pre_qualification_evidence.outputs.artifact-url }}
          PARTNER_ARTIFACT_ID: ${{ steps.upload_partner_screening_evidence.outputs.artifact-id }}
          PARTNER_ARTIFACT_DIGEST: ${{ steps.upload_partner_screening_evidence.outputs.artifact-digest }}
          PARTNER_ARTIFACT_URL: ${{ steps.upload_partner_screening_evidence.outputs.artifact-url }}
        run: |
          rm -rf release_index_ci
          PR_NUMBER=""
          MERGE_STATE="MANUAL_OR_NON_MAIN_RUN"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            PR_NUMBER=$(python - <<'PY'
          import json, os
          event=json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          print(event.get('number') or event.get('pull_request', {}).get('number') or '')
          PY
          )
            MERGE_STATE="PR_CANDIDATE_UNMERGED"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            MERGE_STATE="MAIN_BRANCH_PUSH"
          fi
          ws-release-index \
            --out release_index_ci/release-index.json \
            --pre-dir qualification_evidence_ci \
            --partner-dir partner_screening_ci \
            --sbom-dir sbom_evidence_ci \
            --vulnerability-dir vulnerability_evidence_ci \
            --human-triage-dir human_triage_ci \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow-name "$GITHUB_WORKFLOW" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-number "$GITHUB_RUN_NUMBER" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --pr-number "$PR_NUMBER" \
            --merge-state "$MERGE_STATE" \
            --pre-artifact-id "$PRE_ARTIFACT_ID" \
            --pre-artifact-digest "$PRE_ARTIFACT_DIGEST" \
            --pre-artifact-url "$PRE_ARTIFACT_URL" \
            --partner-artifact-id "$PARTNER_ARTIFACT_ID" \
            --partner-artifact-digest "$PARTNER_ARTIFACT_DIGEST" \
            --partner-artifact-url "$PARTNER_ARTIFACT_URL" \
            --sbom-artifact-id "$SBOM_ARTIFACT_ID" \
            --sbom-artifact-digest "$SBOM_ARTIFACT_DIGEST" \
            --sbom-artifact-url "$SBOM_ARTIFACT_URL" \
            --vulnerability-artifact-id "$VULNERABILITY_ARTIFACT_ID" \
            --vulnerability-artifact-digest "$VULNERABILITY_ARTIFACT_DIGEST" \
            --vulnerability-artifact-url "$VULNERABILITY_ARTIFACT_URL" \
            --human-triage-artifact-id "$HUMAN_TRIAGE_ARTIFACT_ID" \
            --human-triage-artifact-digest "$HUMAN_TRIAGE_ARTIFACT_DIGEST" \
            --human-triage-artifact-url "$HUMAN_TRIAGE_ARTIFACT_URL" \
            --executed-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >/dev/null
          ws-release-index-link-intake \
            --release-index release_index_ci/release-index.json \
            --intake-dir intake_minimum_ci \
            --intake-artifact-id "$INTAKE_ARTIFACT_ID" \
            --intake-artifact-digest "$INTAKE_ARTIFACT_DIGEST" \
            --intake-artifact-url "$INTAKE_ARTIFACT_URL" >/dev/null
          test -s release_index_ci/release-index.json
          python -m json.tool release_index_ci/release-index.json >/dev/null
          python - <<'PY'
          import json, os
          record=json.load(open('release_index_ci/release-index.json', encoding='utf-8'))
          assert record['schema'] == 'WS-SARA-RELEASE-EVIDENCE-INDEX-V1'
          assert record['artifacts']['software_sbom_evidence']['artifact_digest'].startswith('sha256:')
          assert record['artifacts']['vulnerability_advisory_evidence']['artifact_digest'].startswith('sha256:')
          assert record['artifacts']['human_triage_ledger_evidence']['artifact_digest'].startswith('sha256:')
          assert record['artifacts']['intake_minimum_standard_evidence']['artifact_digest'].startswith('sha256:')
          assert record['artifacts']['pre_full_bloom_qualification_evidence']['artifact_digest'].startswith('sha256:')
          assert record['artifacts']['partner_screening_batch_evidence']['artifact_digest'].startswith('sha256:')
          assert record['local_evidence']['sbom_component_count'] > 0
          assert record['local_evidence']['software_sbom_sha256'].startswith('sha256:')
          assert record['local_evidence']['vulnerability_advisory_record_count'] >= 0
          assert record['local_evidence']['vulnerability_report_sha256'].startswith('sha256:')
          assert record['local_evidence']['human_triage_ledger_record_count'] >= 0
          assert record['local_evidence']['human_triage_ledger_sha256'].startswith('sha256:')
          assert record['local_evidence']['intake_minimum_intake_count'] > 0
          assert record['local_evidence']['intake_minimum_ledger_sha256'].startswith('sha256:')
          assert record['local_evidence']['intake_minimum_summary_sha256'].startswith('sha256:')
          assert record['release_index_digest'].startswith('sha256:')
          assert 'does not establish partner validation' in record['claims_boundary']
          assert 'software supply-chain completeness' in record['claims_boundary']
          assert 'absence of vulnerabilities' in record['claims_boundary']
          assert 'vulnerability remediation' in record['claims_boundary']
          assert 'human-review completion' in record['claims_boundary']
          assert 'intake evidence linkage does not establish source truth' in record['claims_boundary'].lower()
          merge_state = record['workflow']['merge_state']
          event_name = record['workflow']['event_name']
          ref = record['workflow']['ref']
          if event_name == 'pull_request':
              assert merge_state == 'PR_CANDIDATE_UNMERGED'
              assert record['workflow']['pull_request_number']
          elif event_name == 'push' and ref == 'refs/heads/main':
              assert merge_state == 'MAIN_BRANCH_PUSH'
              assert record['workflow']['pull_request_number'] is None
          else:
              assert merge_state == 'MANUAL_OR_NON_MAIN_RUN'
          PY

      - name: Upload release evidence index
        id: upload_release_evidence_index
        uses: actions/upload-artifact@v4
        with:
          name: sara-release-evidence-index
          path: deployments/sara_verified_local_v1/release_index_ci
          if-no-files-found: error

      - name: Capture container logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Stop and remove CI services
        if: always()
        run: docker compose down -v || true
