name: SARA Sentinel P1 Blocker Guard

on:
  push:
    branches:
      - sentinel-p1-blocker-hardening
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/__init__.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/infrastructure_assurance.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/infrastructure_assurance_legacy.py'
      - 'deployments/sara_verified_local_v1/tests/test_sentinel_p1_blockers.py'
      - '.github/workflows/sara-sentinel-p1-blockers.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: deployments/sara_verified_local_v1

jobs:
  blocker-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and tests
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -c constraints-ci.txt -e '.[test]'
          python -m pip check

      - name: Run Sentinel P1 blocker regressions
        run: pytest -q tests/test_sentinel_p1_blockers.py

# Exact-head validation trigger retained intentionally so any guard-source change
# produces an auditable push run on the hardening branch.
