name: BAROS bounded research verification

on:
  pull_request:
    paths:
      - 'baros/**'
      - 'tests/test_baros_reference.py'
      - 'tests/test_baros_pipeline.py'
      - 'tests/test_baros_dicom_rt.py'
      - 'tests/test_baros_dvh.py'
      - 'docs/baros/**'
      - '.github/workflows/baros-g1.yml'
  push:
    paths:
      - 'baros/**'
      - 'tests/test_baros_reference.py'
      - 'tests/test_baros_pipeline.py'
      - 'tests/test_baros_dicom_rt.py'
      - 'tests/test_baros_dvh.py'
      - 'docs/baros/**'
      - '.github/workflows/baros-g1.yml'

permissions:
  contents: read

jobs:
  baros-bounded-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded BAROS verification dependencies
        run: python -m pip install --disable-pip-version-check pytest pydicom==3.0.2 numpy
      - name: Run bounded BAROS verification tests
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_baros_reference.py
          tests/test_baros_pipeline.py
          tests/test_baros_dicom_rt.py
          tests/test_baros_dvh.py
      - name: Generate exact-run synthetic evidence bundle
        run: PYTHONPATH=. python -m baros.cli --commit-sha "$GITHUB_SHA" --output baros-evidence.json > baros-evidence.stdout.json
      - name: Assert evidence remains non-clinical and passing
        run: |
          python - <<'PY'
          import json
          data=json.load(open('baros-evidence.json', encoding='utf-8'))
          assert data['passed'] is True
          assert data['patient_care_allowed'] is False
          assert data['claim_state'] == 'SIMULATED_ONLY'
          assert data['commit_sha'] == '${{ github.sha }}'
          PY
      - name: Enforce non-clinical boundary
        run: |
          grep -R "NON-CLINICAL\|not for patient care\|must not be used for patient care" baros
      - uses: actions/upload-artifact@v4
        with:
          name: baros-bounded-evidence-${{ github.sha }}
          path: baros-evidence.json
          if-no-files-found: error

# Passing this workflow proves only the bounded research-software behaviors
# actually exercised here. Synthetic DICOM round trips and numerical DVH
# metrics are not DICOM conformance certification, TPS interoperability,
# physical-dose validation, clinical validation, regulatory authorization,
# or permission for patient use.
