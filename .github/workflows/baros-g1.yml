name: BAROS bounded research verification

on:
  pull_request:
    paths:
      - 'baros/**'
      - 'tests/test_baros_*.py'
      - 'docs/baros/**'
      - '.github/workflows/baros-g1.yml'
  push:
    paths:
      - 'baros/**'
      - 'tests/test_baros_*.py'
      - 'docs/baros/**'
      - '.github/workflows/baros-g1.yml'

concurrency:
  group: baros-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baros-bounded-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned BAROS verification environment
        run: python -m pip install --disable-pip-version-check -r baros/requirements.txt
      - name: Record dependency state
        run: python -m pip freeze | sort > baros-dependencies.txt
      - name: Run all bounded BAROS verification tests
        run: PYTHONPATH=. python -m pytest -q tests/test_baros_*.py
      - name: Generate exact-run synthetic evidence bundle
        run: PYTHONPATH=. python -m baros.cli --commit-sha "$GITHUB_SHA" --output baros-evidence.json > baros-evidence.stdout.json
      - name: Run 1000-case 98.7 percent bounded reliability gate
        run: >-
          PYTHONPATH=. python -m baros.reliability_cli
          --commit-sha "$GITHUB_SHA"
          --cases 1000
          --confidence 0.999
          --target-probability 0.987
          --output baros-reliability-evidence.json
          > baros-reliability.stdout.json
      - name: Assert evidence remains bounded, non-clinical, and passing
        run: |
          python - <<'PY'
          import json
          evidence=json.load(open('baros-evidence.json', encoding='utf-8'))
          reliability=json.load(open('baros-reliability-evidence.json', encoding='utf-8'))
          assert evidence['passed'] is True
          assert evidence['patient_care_allowed'] is False
          assert evidence['claim_state'] == 'SIMULATED_ONLY'
          assert evidence['commit_sha'] == '${{ github.sha }}'
          assert reliability['commit_sha'] == '${{ github.sha }}'
          assert reliability['cases'] == 1000
          assert reliability['successes'] == 1000
          assert reliability['failures'] == 0
          assert reliability['gate_passed'] is True
          assert reliability['confidence'] == 0.999
          assert reliability['target_probability'] == 0.987
          assert reliability['lower_confidence_bound'] >= 0.987
          assert reliability['lower_confidence_bound'] > 0.993
          assert reliability['clinical_probability_claimed'] is False
          PY
      - name: Enforce non-clinical boundary
        run: |
          grep -R "NON-CLINICAL\|not for patient care\|must not be used for patient care" baros
      - uses: actions/upload-artifact@v4
        with:
          name: baros-bounded-evidence-${{ github.sha }}
          path: |
            baros-evidence.json
            baros-reliability-evidence.json
            baros-dependencies.txt
          if-no-files-found: error

# A passing 1000-case reliability gate supports only this statement:
# within the predeclared bounded synthetic case distribution, zero observed
# failures yield an exact one-sided 99.9% lower confidence bound above 98.7%
# for the probability that the research-software acceptance criteria pass.
# It does NOT establish clinical safety/effectiveness, treatment success,
# physical-dose accuracy, DICOM conformance certification, TPS interoperability,
# regulatory authorization, or permission for patient use.
