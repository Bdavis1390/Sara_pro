name: QCRYPTO PoS PQ Transition Gate

on:
  pull_request:
    paths:
      - 'security/qcrypto/pqc_algorithm_policy.py'
      - 'security/qcrypto/pos_pq_readiness.py'
      - 'security/qcrypto/pos_pqc_transition_gate.py'
      - 'tests/test_qcrypto_pqc_algorithm_policy.py'
      - 'tests/test_qcrypto_pos_pq_readiness.py'
      - 'tests/test_qcrypto_pos_pqc_transition_gate.py'
      - 'scripts/qcrypto_pos_pqc_transition_evidence.py'
      - '.github/workflows/qcrypto-pos-pqc-transition.yml'
  push:
    branches:
      - worldshepherd-qcrypto-width-time-risk-v1
    paths:
      - 'security/qcrypto/pqc_algorithm_policy.py'
      - 'security/qcrypto/pos_pq_readiness.py'
      - 'security/qcrypto/pos_pqc_transition_gate.py'
      - 'tests/test_qcrypto_pqc_algorithm_policy.py'
      - 'tests/test_qcrypto_pos_pq_readiness.py'
      - 'tests/test_qcrypto_pos_pqc_transition_gate.py'
      - 'scripts/qcrypto_pos_pqc_transition_evidence.py'
      - '.github/workflows/qcrypto-pos-pqc-transition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pos-pqc-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile cross-layer policy
        run: |
          python -m compileall \
            security/qcrypto/pqc_algorithm_policy.py \
            security/qcrypto/pos_pq_readiness.py \
            security/qcrypto/pos_pqc_transition_gate.py \
            scripts/qcrypto_pos_pqc_transition_evidence.py

      - name: Run algorithm, system, and cross-layer regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_qcrypto_pqc_algorithm_policy.py \
            tests/test_qcrypto_pos_pq_readiness.py \
            tests/test_qcrypto_pos_pqc_transition_gate.py

      - name: Generate cross-layer evidence
        env:
          PYTHONPATH: .
        run: |
          python scripts/qcrypto_pos_pqc_transition_evidence.py \
            --output pos-pqc-transition-evidence.json

      - name: Assert two-key fail-closed posture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence=json.loads(Path('pos-pqc-transition-evidence.json').read_text())
          assert evidence['schema']=='WS-POS-PQC-TRANSITION-EVIDENCE-V1'
          assert evidence['status']=='PASS'
          r=evidence['results']
          assert r['QRL2_ML_DSA_TESTNET']['verdict']=='PUBLIC_TESTNET_PQ_VALIDATOR_AUTH_CANDIDATE'
          assert r['QRL2_ML_DSA_TESTNET']['production_pq_consensus_ready'] is False
          assert r['QRL2_FN_DSA_TESTNET']['verdict']=='BLOCKED_ALGORITHM_POLICY'
          assert r['ETHEREUM_ML_DSA_TESTNET']['verdict']=='BLOCKED_SYSTEM_READINESS'
          assert r['ALGORAND_ML_DSA_PRODUCTION']['verdict']=='BLOCKED_SYSTEM_READINESS'
          assert r['QRL2_STALE_ML_DSA']['verdict']=='BLOCKED_ALGORITHM_POLICY'
          assert r['QRL2_HYBRID_ML_DSA']['hybrid_dependency_present'] is True
          assert r['QRL2_HYBRID_ML_DSA']['end_to_end_pq_security_established'] is False
          synthetic=r['SYNTHETIC_PRODUCTION_ML_DSA']
          assert synthetic['verdict']=='BOUNDED_PRODUCTION_PQ_CONSENSUS_INTEGRATION_REVIEW'
          assert synthetic['production_pq_consensus_ready'] is False
          assert evidence['summary']['bounded_production_review_is_synthetic_only'] is True
          assert evidence['summary']['real_world_production_pq_consensus_ready_count']==0
          assert evidence['summary']['end_to_end_pq_security_established_count']==0
          assert len(evidence['evidence_sha256'])==64
          print('pos_pqc_transition_status: PASS')
          print('public_testnet_candidates:', evidence['summary']['public_testnet_candidates'])
          print('evidence_sha256:', evidence['evidence_sha256'])
          PY

      - name: Upload cross-layer PQ transition evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws-pos-pqc-transition-evidence
          path: pos-pqc-transition-evidence.json
          if-no-files-found: error
