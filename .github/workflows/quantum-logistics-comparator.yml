name: Quantum Logistics Classical Comparator

on:
  pull_request:
    paths:
      - "worldshepherd_sara/quantum_logistics_ortools.py"
      - "worldshepherd_sara/quantum_logistics_instance.py"
      - "scripts/generate_quantum_logistics_classical_baseline.py"
      - "tests/test_quantum_logistics_ortools.py"
      - "requirements-quantum-logistics.txt"
      - "benchmarks/quantum/logistics_cp_sat_fixture.json"
      - ".github/workflows/quantum-logistics-comparator.yml"
  push:
    branches:
      - "agent/quantum-readiness-fabric"
    paths:
      - "worldshepherd_sara/quantum_logistics_ortools.py"
      - "worldshepherd_sara/quantum_logistics_instance.py"
      - "scripts/generate_quantum_logistics_classical_baseline.py"
      - "tests/test_quantum_logistics_ortools.py"
      - "requirements-quantum-logistics.txt"
      - "benchmarks/quantum/logistics_cp_sat_fixture.json"
      - ".github/workflows/quantum-logistics-comparator.yml"

jobs:
  cp-sat-comparator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-quantum-logistics.txt

      - name: Install comparator dependencies
        run: |
          python -m pip install pytest
          python -m pip install -r requirements-quantum-logistics.txt

      - name: Compile comparator
        run: |
          python -m py_compile worldshepherd_sara/quantum_logistics_ortools.py scripts/generate_quantum_logistics_classical_baseline.py

      - name: Test comparator
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_quantum_logistics_ortools.py

      - name: Generate controlled comparator evidence
        env:
          PYTHONPATH: .
        run: |
          python scripts/generate_quantum_logistics_classical_baseline.py \
            --input benchmarks/quantum/logistics_cp_sat_fixture.json \
            --output .qrf-logistics/quantum_logistics_cp_sat_controlled_baseline.json \
            --time-limit-seconds 30 \
            --seed 9675
          python -m json.tool .qrf-logistics/quantum_logistics_cp_sat_controlled_baseline.json >/dev/null

      - name: Upload controlled comparator artifact
        uses: actions/upload-artifact@v4
        with:
          name: qrf-logistics-cp-sat-py3.12
          path: .qrf-logistics/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
