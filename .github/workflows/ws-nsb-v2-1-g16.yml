name: WS-NSB v2.1 G16 Gate

on:
  pull_request:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g16_electrothermal_driver.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g16_cli.py'
      - 'deployments/sara_verified_local_v1/tests/test_nsb_g16_electrothermal_driver.py'
      - 'deployments/sara_verified_local_v1/docs/WS_NSB_V2_1_G16_ELECTROTHERMAL_DRIVER.md'
      - 'deployments/sara_verified_local_v1/pyproject.toml'
      - '.github/workflows/ws-nsb-v2-1-g16.yml'
  push:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g16_electrothermal_driver.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g16_cli.py'
      - 'deployments/sara_verified_local_v1/tests/test_nsb_g16_electrothermal_driver.py'
      - 'deployments/sara_verified_local_v1/docs/WS_NSB_V2_1_G16_ELECTROTHERMAL_DRIVER.md'
      - 'deployments/sara_verified_local_v1/pyproject.toml'
      - '.github/workflows/ws-nsb-v2-1-g16.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: deployments/sara_verified_local_v1

jobs:
  g16-electrothermal-driver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and tests
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -c constraints-ci.txt -e '.[test]'
          python -m pip check

      - name: Run G16 test suite
        run: python -m pytest tests/test_nsb_g16_electrothermal_driver.py -q

      - name: Execute and verify deterministic G16 report
        run: |
          rm -f ws_nsb_g16_report.json
          ws-nsb-g16 --output ws_nsb_g16_report.json
          ws-nsb-g16 --verify ws_nsb_g16_report.json

      - name: Upload G16 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws-nsb-v2-1-g16-report
          path: deployments/sara_verified_local_v1/ws_nsb_g16_report.json
          if-no-files-found: error
