name: connector-read-broker-r2-ci

on:
  push:
    branches:
      - "worldshepherd/connectors-read-broker-v1-r2-*"
      - "worldshepherd/connectors-ticket-lifecycle-v1-*"
      - "worldshepherd/connectors-durable-ledger-v1-*"
      - "worldshepherd/connectors-distributed-claim-contract-v1-*"
      - "worldshepherd/connectors-dbtime-clock-skew-v1-*"
      - "worldshepherd/connectors-failure-injection-v1-*"
  pull_request:
    paths:
      - "data/worldshepherd_connectors.v2.json"
      - "data/worldshepherd_read_ticket_policy.v1.json"
      - "worldshepherd_sara/connector_control.py"
      - "worldshepherd_sara/connector_execution.py"
      - "worldshepherd_sara/connector_receipt.py"
      - "worldshepherd_sara/connector_ticket_lifecycle.py"
      - "worldshepherd_sara/connector_ticket_sqlite.py"
      - "worldshepherd_sara/connector_ticket_shared.py"
      - "worldshepherd_sara/connector_ticket_postgres.py"
      - "tests/test_connector_ticket_lifecycle.py"
      - "tests/test_connector_ticket_sqlite.py"
      - "tests/test_connector_ticket_shared.py"
      - "tests/test_connector_ticket_postgres.py"
      - ".github/workflows/connector-read-broker-r2-ci.yml"

permissions:
  contents: read

jobs:
  broker-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install runtime imports
        run: python -m pip install --disable-pip-version-check fastapi pytest
      - name: Compile connector claim stack
        run: python -m py_compile worldshepherd_sara/connector_control.py worldshepherd_sara/connector_execution.py worldshepherd_sara/connector_receipt.py worldshepherd_sara/connector_ticket_lifecycle.py worldshepherd_sara/connector_ticket_sqlite.py worldshepherd_sara/connector_ticket_shared.py worldshepherd_sara/connector_ticket_postgres.py
      - name: Verify lifecycle durable and shared claim contracts
        run: python -m pytest -q tests/test_connector_ticket_lifecycle.py tests/test_connector_ticket_sqlite.py tests/test_connector_ticket_shared.py tests/test_connector_ticket_postgres.py
