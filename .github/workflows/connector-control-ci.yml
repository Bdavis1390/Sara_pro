name: connector-control-ci

on:
  push:
    branches:
      - "worldshepherd/tools-connectors-v2-*"
  pull_request:
    paths:
      - "data/worldshepherd_connectors.v2.json"
      - "worldshepherd_sara/connector_control.py"
      - "tools/connector_control/**"
      - "tests/test_connector_control.py"
      - ".github/workflows/connector-control-ci.yml"

permissions:
  contents: read

jobs:
  connector-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile connector modules
        run: python -m compileall worldshepherd_sara tools/connector_control

      - name: Validate connector manifest
        run: python tools/connector_control/validate.py

      - name: Run connector policy tests
        run: python -m pytest -q tests/test_connector_control.py

      - name: Verify dry-run default deny
        run: |
          set +e
          python tools/connector_control/evaluate.py github file.update --actor admin --data-class INTERNAL
          code=$?
          set -e
          test "$code" -eq 2
