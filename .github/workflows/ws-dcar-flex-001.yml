name: WS-DCAR FLEX-001

on:
  pull_request:
    paths:
      - "docs/WS_DCAR_V0_1_2026-09-30.md"
      - "research/ws_dcar_flex_001/**"
      - ".github/workflows/ws-dcar-flex-001.yml"
  push:
    paths:
      - "docs/WS_DCAR_V0_1_2026-09-30.md"
      - "research/ws_dcar_flex_001/**"
      - ".github/workflows/ws-dcar-flex-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flex-001:
    name: FLEX-001 adversarial verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "pytest==8.4.2"
      - name: Compile reference implementation
        working-directory: research/ws_dcar_flex_001
        run: python -m compileall -q .
      - name: Run FLEX-001 regression suite
        working-directory: research/ws_dcar_flex_001
        run: python -m pytest -q
