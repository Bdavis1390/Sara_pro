name: connector-read-broker-ci

on:
  push:
    branches:
      - "worldshepherd/connectors-read-broker-v1-*"
  pull_request:
    paths:
      - "worldshepherd_sara/connector_execution.py"
      - "tests/test_connector_execution.py"
      - ".github/workflows/connector-read-broker-ci.yml"

permissions:
  contents: read

jobs:
  read-broker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile read broker
        run: python -m py_compile worldshepherd_sara/connector_execution.py

      - name: Run read broker tests
        run: python -m pytest -q tests/test_connector_execution.py
