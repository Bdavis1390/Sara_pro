name: QCRYPTO External Signer Custody Gate

on:
  pull_request:
    paths:
      - 'deployments/qcrypto_external_signer/**'
      - '.github/workflows/qcrypto-external-custody-signer.yml'
  push:
    branches:
      - worldshepherd-qcrypto-width-time-risk-v1
    paths:
      - 'deployments/qcrypto_external_signer/**'
      - '.github/workflows/qcrypto-external-custody-signer.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: deployments/qcrypto_external_signer

jobs:
  external-custody-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated custody environment
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -e '.[test]'
          python -m pip check

      - name: Compile isolated custody package
        run: |
          python -m compileall -q qcrypto_external_signer scripts tests

      - name: Run custody and provider regressions
        run: |
          pytest -q

      - name: Generate synthetic custody and provider evidence
        run: |
          python scripts/verify_external_custody.py --output external-custody-evidence.json
          python scripts/verify_opaque_provider_custody.py --output opaque-provider-custody-evidence.json
          python scripts/verify_unix_provider_boundary.py --output unix-provider-boundary-evidence.json
          python scripts/verify_aws_kms_provider_contract.py --output aws-kms-provider-contract-evidence.json

      - name: Assert custody and production-provider claims boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          e=json.loads(Path('external-custody-evidence.json').read_text(encoding='utf-8'))
          assert e['schema']=='WS-QCRYPTO-EXTERNAL-CUSTODY-EVIDENCE-V1'
          assert e['status']=='PASS'
          assert e['claim_state']=='EXTERNAL_CUSTODY_RELEASE_SOFTWARE_BEHAVIOR_ONLY'
          assert e['synthetic_ci_only'] is True
          assert e['separate_trust_domain'] is True
          assert e['sara_runtime_dependency'] is False
          assert e['receipt_verified'] is True
          assert e['exact_retry_identical'] is True
          assert e['restart_retry_identical'] is True
          assert e['post_expiry_retry_identical'] is True
          assert e['signer_invocation_count']==1
          assert e['durable_signed_state']=='SIGNED'
          assert e['durable_request_envelope_identity'] is True
          assert e['ambiguous_outcome_state']=='INDETERMINATE'
          assert e['ambiguous_outcome_post_expiry_retry_blocked'] is True
          assert e['ambiguous_signer_invocation_count']==1
          assert e['broadcast_request_blocked'] is True
          assert e['mainnet_permitted'] is False
          assert e['transaction_broadcast'] is False
          assert e['chain_native_transaction_signature'] is False
          assert e['real_wallet_used'] is False
          assert e['real_value_moved'] is False
          assert e['private_key_exported'] is False
          assert e['production_hsm_integrated'] is False
          assert e['end_to_end_pq_security_established'] is False

          r=e['receipt']
          assert r['state']=='SIGNED_CUSTODY_RELEASE_ATTESTATION'
          assert r['signing_algorithm']=='ML-DSA-65'
          assert r['signature_context']=='WS-QCRYPTO-EXTERNAL-CUSTODY-RELEASE-V1'
          assert r['chain_native_transaction_signature'] is False
          assert r['transaction_broadcast'] is False
          assert r['real_value_moved'] is False
          assert r['mainnet'] is False
          assert r['production_hsm_integrated'] is False
          assert len(r['receipt_sha256'])==64
          assert len(e['evidence_sha256'])==64

          p=json.loads(Path('opaque-provider-custody-evidence.json').read_text(encoding='utf-8'))
          assert p['schema']=='WS-QCRYPTO-OPAQUE-PROVIDER-CUSTODY-EVIDENCE-V1'
          assert p['status']=='PASS'
          assert p['claim_state']=='OPAQUE_PROVIDER_CUSTODY_SOFTWARE_BEHAVIOR_ONLY'
          assert p['synthetic_ci_only'] is True
          assert p['separate_trust_domain'] is True
          assert p['private_key_export_api_present'] is False
          assert p['provider_ack_loss_blocked_as_indeterminate'] is True
          assert p['durable_indeterminate_state']=='INDETERMINATE'
          assert p['provider_operation_id_retained_before_reconciliation'] is True
          assert p['release_binding_retained_before_reconciliation'] is True
          assert p['provider_key_handle_in_signed_binding'] is True
          assert p['provider_handle_and_operation_id_substitution_rejected'] is True
          assert p['provider_invocations_before_reconcile']==1
          assert p['provider_invocations_after_reconcile']==1
          assert p['reconciliation_did_not_reinvoke_signer'] is True
          assert p['receipt_verified'] is True
          assert p['receipt_provider_reconciled'] is True
          assert p['receipt_provider_operation_matches_ledger'] is True
          assert p['receipt_provider_key_handle_matches_provider'] is True
          assert p['durable_final_state']=='SIGNED'
          assert p['durable_provider_reconciled'] is True
          assert p['post_expiry_retry_identical'] is True
          assert p['provider_invocations_after_restart_retry']==1
          assert p['provider_not_found_safe_to_retry_reported'] is True
          assert p['provider_not_found_did_auto_retry'] is False if 'provider_not_found_did_auto_retry' in p else p['provider_not_found_did_auto_retry'] if False else True
          assert p['provider_not_found_did_not_auto_retry'] is True
          assert p['provider_not_found_requires_new_human_authorization'] is True
          assert p['production_hsm_integrated'] is False
          assert p['fips_validated_module_established'] is False
          assert p['native_chain_transaction_signature'] is False
          assert p['transaction_broadcast'] is False
          assert p['mainnet_permitted'] is False
          assert p['real_value_moved'] is False

          pr=p['receipt']
          assert pr['state']=='SIGNED_CUSTODY_RELEASE_ATTESTATION'
          assert pr['signing_algorithm']=='ML-DSA-65'
          assert pr['signature_context']=='WS-QCRYPTO-OPAQUE-PROVIDER-V1'
          assert pr['provider_reconciled'] is True
          assert pr['provider_operation_id']==p['provider_operation_id']
          assert pr['chain_native_transaction_signature'] is False
          assert pr['transaction_broadcast'] is False
          assert pr['real_value_moved'] is False
          assert pr['mainnet'] is False
          assert pr['production_hsm_integrated'] is False
          assert len(pr['receipt_sha256'])==64
          assert len(p['evidence_sha256'])==64

          u=json.loads(Path('unix-provider-boundary-evidence.json').read_text(encoding='utf-8'))
          assert u['schema']=='WS-QCRYPTO-UNIX-SIGNER-BOUNDARY-EVIDENCE-V1'
          assert u['status']=='PASS'
          assert u['claim_state']=='SEPARATE_SIGNER_PROCESS_SOFTWARE_BEHAVIOR_ONLY'
          assert u['synthetic_ci_only'] is True
          assert u['signer_process_separate'] is True
          assert u['transport']=='UNIX_DOMAIN_SOCKET_ONLY'
          assert u['socket_is_unix_domain'] is True
          assert u['socket_owner_read_write_only'] is True
          assert u['socket_mode_octal']=='0o600'
          assert u['socket_directory_not_group_world_accessible'] is True
          assert u['private_key_export_attribute_absent'] is True
          assert u['private_key_export_rpc_rejected'] is True
          assert u['tcp_transport_surface_absent'] is True
          assert u['remote_algorithm']=='ML-DSA-65'
          assert u['provider_ack_loss_fail_stopped'] is True
          assert u['outbound_begin_sign_calls_before_reconcile']==1
          assert u['outbound_begin_sign_calls_after_reconcile']==1
          assert u['outbound_reconcile_calls_before_reconcile']==0
          assert u['outbound_reconcile_calls_after_reconcile']==1
          assert u['reconciliation_did_not_issue_second_sign_call'] is True
          assert u['receipt_verified'] is True
          assert u['receipt_provider_reconciled'] is True
          assert u['durable_state']=='SIGNED'
          assert u['durable_provider_operation_id_matches_receipt'] is True
          assert u['custody_side_restart_post_expiry_receipt_identical'] is True
          assert u['restart_begin_sign_calls']==0
          assert u['restart_reconcile_calls']==0
          assert u['production_hsm_integrated'] is False
          assert u['fips_validated_module_established'] is False
          assert u['native_chain_transaction_signature'] is False
          assert u['transaction_broadcast'] is False
          assert u['mainnet_permitted'] is False
          assert u['real_value_moved'] is False
          assert u['federal_compliance_established'] is False
          assert u['independent_validation_established'] is False
          assert u['end_to_end_pq_chain_security_established'] is False
          assert len(u['evidence_sha256'])==64

          k=json.loads(Path('aws-kms-provider-contract-evidence.json').read_text(encoding='utf-8'))
          assert k['schema']=='WS-QCRYPTO-AWS-KMS-PROVIDER-CONTRACT-EVIDENCE-V1'
          assert k['status']=='PASS'
          assert k['claim_state']=='AWS_KMS_ML_DSA_65_ADAPTER_IMPLEMENTED_NOT_LIVE_INTEGRATED'
          assert k['synthetic_contract_client_only'] is True
          assert k['aws_live_api_called'] is False
          assert k['production_provider_adapter_implemented'] is True
          assert k['required_key_spec']=='ML_DSA_65'
          assert k['required_key_usage']=='SIGN_VERIFY'
          assert k['required_signing_algorithm']=='ML_DSA_SHAKE_256'
          assert k['message_type']=='EXTERNAL_MU'
          assert k['external_mu_length']==64
          assert k['fips204_nonempty_context_preserved'] is True
          assert k['signature_verified_against_original_message_and_context'] is True
          assert k['successful_sign_calls']==1
          assert k['ambiguous_sign_fail_stopped'] is True
          assert k['ambiguous_sign_calls_before_reconcile']==1
          assert k['ambiguous_sign_calls_after_reconcile']==1
          assert k['reconcile_state']=='INDETERMINATE'
          assert k['reconcile_safe_to_retry'] is False
          assert k['reconciliation_reissued_sign'] is False
          assert k['worldshepherd_fips_validation_established'] is False
          assert k['federal_compliance_established'] is False
          assert k['independent_validation_established'] is False
          assert k['chain_native_transaction_signature'] is False
          assert k['transaction_broadcast'] is False
          assert k['mainnet_authority'] is False
          assert k['real_value_moved'] is False
          assert k['end_to_end_pq_cryptocurrency_security_established'] is False
          assert len(k['evidence_sha256'])==64

          forbidden_keys={
              'private_key_pem','private_key_bytes','secret_key','secret_key_bytes',
              'seed_phrase','mnemonic','xprv','wallet_seed','validator_key','withdrawal_key',
          }
          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      assert key.lower() not in forbidden_keys, key
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
              elif isinstance(value, str):
                  lowered=value.lower()
                  assert 'seed phrase' not in lowered
                  assert 'mnemonic' not in lowered
          for artifact in (e,p,u,k):
              walk(artifact)

          print('qcrypto_external_custody_gate: PASS')
          print('receipt_sha256:', r['receipt_sha256'])
          print('opaque_provider_receipt_sha256:', pr['receipt_sha256'])
          print('opaque_provider_operation_id:', p['provider_operation_id'])
          print('unix_signer_process_id:', u['signer_process_id'])
          print('aws_kms_contract_evidence_sha256:', k['evidence_sha256'])
          print('evidence_sha256:', e['evidence_sha256'])
          print('opaque_provider_evidence_sha256:', p['evidence_sha256'])
          print('unix_provider_evidence_sha256:', u['evidence_sha256'])
          PY

      - name: Upload external custody evidence
        uses: actions/upload-artifact@v4
        with:
          name: qcrypto-external-custody-release-evidence
          path: |
            deployments/qcrypto_external_signer/external-custody-evidence.json
            deployments/qcrypto_external_signer/opaque-provider-custody-evidence.json
            deployments/qcrypto_external_signer/unix-provider-boundary-evidence.json
            deployments/qcrypto_external_signer/aws-kms-provider-contract-evidence.json
          if-no-files-found: error
