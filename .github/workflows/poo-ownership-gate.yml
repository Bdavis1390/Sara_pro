name: Proof of Ownership Gate

on:
  pull_request:
    paths:
      - 'security/poo/**'
      - 'tests/test_poo_*.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/poo_audit_adapter.py'
      - 'deployments/sara_verified_local_v1/tests/test_poo_audit_adapter.py'
      - '.github/workflows/poo-ownership-gate.yml'
  push:
    branches:
      - main
      - 'worldshepherd-proof-of-ownership-*'
    paths:
      - 'security/poo/**'
      - 'tests/test_poo_*.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/poo_audit_adapter.py'
      - 'deployments/sara_verified_local_v1/tests/test_poo_audit_adapter.py'
      - '.github/workflows/poo-ownership-gate.yml'

permissions:
  contents: read

jobs:
  poo-ownership-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SARA test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -c deployments/sara_verified_local_v1/constraints-runtime.txt
          './deployments/sara_verified_local_v1[test]'
      - name: Compile all PoO modules and SARA adapter
        run: |
          python -m compileall -q security/poo
          python -m py_compile deployments/sara_verified_local_v1/worldshepherd_sara/poo_audit_adapter.py
      - name: Run all PoO protocol and governance regressions
        run: python -m pytest -q tests/test_poo_*.py
      - name: Run native SARA PoO audit adapter regression
        env:
          PYTHONPATH: deployments/sara_verified_local_v1
        run: python -m pytest -q deployments/sara_verified_local_v1/tests/test_poo_audit_adapter.py
      - name: Enforce core claims and V3 governance boundaries
        run: |
          grep -q 'POO_SCHEMA = "WS-POO-V3"' security/poo/ownership_guard.py
          grep -q 'TRANSFER_SCHEMA = "WS-POO-TRANSFER-V3"' security/poo/transfer_guard.py
          grep -q 'RECOVERY_SCHEMA = "WS-POO-RECOVERY-V3"' security/poo/recovery_guard.py
          grep -q 'COC_SCHEMA = "WS-POO-COC-V1"' security/poo/coc_guard.py
          grep -q 'STATE_SCHEMA = "WS-POO-TECHNICAL-STATE-V1"' security/poo/state_engine.py
          grep -q 'STATE_LINEAGE_SCHEMA = "WS-POO-STATE-LINEAGE-V1"' security/poo/state_engine.py
          grep -q 'REGISTRY_SCHEMA = "WS-POO-TECHNICAL-REGISTRY-V1"' security/poo/registry_guard.py
          grep -q 'COMMIT_SCHEMA = "WS-POO-REGISTRY-COMMIT-V1"' security/poo/commit_guard.py
          grep -q 'STATE_GOVERNANCE_SCHEMA = "WS-POO-STATE-GOVERNANCE-V1"' security/poo/state_governance_guard.py
          grep -q 'REGISTRY_GOVERNANCE_SCHEMA = "WS-POO-REGISTRY-GOVERNANCE-V1"' security/poo/registry_governance_guard.py
          grep -q 'POO_AUDIT_SCHEMA = "WS-POO-GOVERNANCE-DECISION-V3"' security/poo/audit_projection.py
          grep -q 'POO_AUDIT_SCHEMA = "WS-POO-GOVERNANCE-DECISION-V3"' deployments/sara_verified_local_v1/worldshepherd_sara/poo_audit_adapter.py
          grep -q 'POO_EVENT_SCHEMA = "WS-POO-SARA-AUDIT-EVENT-V3"' deployments/sara_verified_local_v1/worldshepherd_sara/poo_audit_adapter.py
          grep -q 'coc_reference' security/poo/ownership_guard.py
          grep -q 'recipient_coc_reference' security/poo/transfer_guard.py
          grep -q 'recovery_coc_reference' security/poo/recovery_guard.py
          grep -q 'COC digest does not match semantic COC reference' security/poo/state_engine.py
          grep -q 'STATE_LINEAGE_CONFLICT_BLOCKED' security/poo/state_governance_guard.py
          grep -q 'STATE_TRANSFER_READY_WITH_LINEAGE_GUARD' security/poo/state_governance_guard.py
          grep -q 'STATE_RECOVERY_READY_WITH_LINEAGE_GUARD' security/poo/state_governance_guard.py
          grep -q 'REGISTRY_COMMIT_READY_WITH_FULL_GOVERNANCE' security/poo/registry_governance_guard.py
          grep -q 'REGISTRY_COMMIT_BLOCKED_STALE_SNAPSHOT' security/poo/registry_governance_guard.py
          grep -q 'technical_state_committed=False' security/poo/state_engine.py
          grep -q 'technical_registry_committed=False' security/poo/commit_guard.py
          grep -q 'durable_registry_write_authorized=False' security/poo/registry_governance_guard.py
          grep -q 'conflict_winner_selected=False' security/poo/state_governance_guard.py
          grep -q 'lineage_auto_resolved=False' security/poo/state_governance_guard.py
          grep -q 'conflict_winner_selected=False' security/poo/registry_governance_guard.py
          grep -q 'lineage_auto_resolved=False' security/poo/registry_governance_guard.py
          grep -q 'PRIME_POO_GOVERNED_STATE_TRANSITION_READY' security/poo/audit_projection.py
          grep -q 'PRIME_POO_REGISTRY_COMMIT_CANDIDATE_READY' security/poo/audit_projection.py
          grep -q 'SARA_POO_REGISTRY_COMMIT_REEVALUATION_REQUIRED' security/poo/audit_projection.py
          grep -q 'registry_commit_ready' deployments/sara_verified_local_v1/worldshepherd_sara/poo_audit_adapter.py
          grep -q 'optimistic_concurrency_match' deployments/sara_verified_local_v1/worldshepherd_sara/poo_audit_adapter.py
          grep -q 'durable_registry_write_authorized' deployments/sara_verified_local_v1/worldshepherd_sara/poo_audit_adapter.py
