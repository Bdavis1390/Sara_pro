name: SPDX Jena Semantic Interoperability Gate

on:
  pull_request:
    paths:
      - 'deployments/sara_verified_local_v1/tests/fixtures/spdx301_minimal.spdx3.json'
      - 'deployments/sara_verified_local_v1/docs/SPDX_JENA_SEMANTIC_DIVERSITY.md'
      - '.github/workflows/spdx-jena-semantic-diversity-gate.yml'
  push:
    branches:
      - 'worldshepherd-spdx-jena-semantic-*'
    paths:
      - 'deployments/sara_verified_local_v1/tests/fixtures/spdx301_minimal.spdx3.json'
      - 'deployments/sara_verified_local_v1/docs/SPDX_JENA_SEMANTIC_DIVERSITY.md'
      - '.github/workflows/spdx-jena-semantic-diversity-gate.yml'

permissions:
  contents: read

env:
  JENA_VERSION: '6.2.0'
  PYSHACL_VERSION: '0.40.1'
  EXPECTED_MODEL_SHA256: '30ebb4af2d70a9809044ef46f44cc3dc5125226d70f818a50ed2e1d5f404c593'
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  probe-semantic-interoperability:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned pySHACL comparison engine
        run: |
          set -euo pipefail
          python -m venv /tmp/ws-pyshacl
          /tmp/ws-pyshacl/bin/python -m pip install --disable-pip-version-check "pyshacl==$PYSHACL_VERSION" >/dev/null
          /tmp/ws-pyshacl/bin/python -m pip check
          actual=$(/tmp/ws-pyshacl/bin/python - <<'PY'
          from importlib.metadata import version
          print(version('pyshacl'))
          PY
          )
          test "$actual" = "$PYSHACL_VERSION"

      - name: Download and checksum-verify Apache Jena binary distribution
        run: |
          set -euo pipefail
          mkdir -p /tmp/ws-jena-download
          cd /tmp/ws-jena-download
          base="https://downloads.apache.org/jena/binaries/apache-jena-${JENA_VERSION}.tar.gz"
          curl --fail --silent --show-error --location "$base" -o "apache-jena-${JENA_VERSION}.tar.gz"
          curl --fail --silent --show-error --location "${base}.sha512" -o "apache-jena-${JENA_VERSION}.tar.gz.sha512"
          sha512sum --check "apache-jena-${JENA_VERSION}.tar.gz.sha512"
          tar -xzf "apache-jena-${JENA_VERSION}.tar.gz" -C /tmp
          test -x "/tmp/apache-jena-${JENA_VERSION}/bin/riot"
          test -x "/tmp/apache-jena-${JENA_VERSION}/bin/shacl"
          sha512sum "apache-jena-${JENA_VERSION}.tar.gz" > /tmp/jena-archive.sha512
          java -version 2> /tmp/java-version.txt

      - name: Fetch and pin canonical SPDX 3.0.1 SHACL model
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            'https://spdx.org/rdf/3.0.1/spdx-model.ttl' \
            --output /tmp/spdx-3.0.1-model.ttl
          actual=$(sha256sum /tmp/spdx-3.0.1-model.ttl | awk '{print $1}')
          test "$actual" = "$EXPECTED_MODEL_SHA256"

      - name: Prove Jena SHACL class-constraint engine with independent micro-control
        run: |
          set -euo pipefail
          JENA_HOME="/tmp/apache-jena-${JENA_VERSION}"
          cat > /tmp/jena-control-shapes.ttl <<'TTL'
          @prefix sh: <http://www.w3.org/ns/shacl#> .
          @prefix ex: <urn:worldshepherd:jena-control:> .

          ex:CreationInfoShape
            a sh:NodeShape ;
            sh:targetClass ex:CreationInfo ;
            sh:property [
              sh:path ex:createdBy ;
              sh:class ex:Agent
            ] .
          TTL
          cat > /tmp/jena-control-baseline.ttl <<'TTL'
          @prefix ex: <urn:worldshepherd:jena-control:> .
          ex:creation a ex:CreationInfo ; ex:createdBy ex:person .
          ex:person a ex:Agent .
          TTL
          cat > /tmp/jena-control-negative.ttl <<'TTL'
          @prefix ex: <urn:worldshepherd:jena-control:> .
          ex:creation a ex:CreationInfo ; ex:createdBy ex:package .
          ex:package a ex:Package .
          TTL

          "$JENA_HOME/bin/shacl" validate --text \
            --shapes /tmp/jena-control-shapes.ttl \
            --data /tmp/jena-control-baseline.ttl \
            > /tmp/jena-control-baseline.log
          grep -qx 'Conforms' /tmp/jena-control-baseline.log

          "$JENA_HOME/bin/shacl" validate --text \
            --shapes /tmp/jena-control-shapes.ttl \
            --data /tmp/jena-control-negative.ttl \
            > /tmp/jena-control-negative.log
          if grep -qx 'Conforms' /tmp/jena-control-negative.log; then
            echo 'Jena failed its independent sh:class negative micro-control' >&2
            exit 1
          fi
          grep -Eq 'Agent|class|ClassConstraint' /tmp/jena-control-negative.log

      - name: Inspect Jena parsing of canonical SPDX shapes
        run: |
          set -euo pipefail
          JENA_HOME="/tmp/apache-jena-${JENA_VERSION}"
          "$JENA_HOME/bin/shacl" parse /tmp/spdx-3.0.1-model.ttl \
            > /tmp/jena-spdx-parsed-shapes.log
          test -s /tmp/jena-spdx-parsed-shapes.log
          grep -q 'createdBy' /tmp/jena-spdx-parsed-shapes.log
          grep -q 'Agent' /tmp/jena-spdx-parsed-shapes.log

      - name: Build exact SPDX semantic mutation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('deployments/sara_verified_local_v1/tests/fixtures/spdx301_minimal.spdx3.json')
          baseline = json.loads(src.read_text(encoding='utf-8'))
          mutation = json.loads(json.dumps(baseline))
          package_id = next(
              element['spdxId']
              for element in mutation['@graph']
              if element.get('type') == 'software_Package'
          )
          creation_info = next(
              element
              for element in mutation['@graph']
              if element.get('type') == 'CreationInfo'
          )
          creation_info['createdBy'] = [package_id]
          Path('/tmp/spdx-baseline.jsonld').write_text(
              json.dumps(baseline, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path('/tmp/spdx-semantic-invalid.jsonld').write_text(
              json.dumps(mutation, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Merge JSON-LD quads into complete Jena data graphs
        run: |
          set -euo pipefail
          JENA_HOME="/tmp/apache-jena-${JENA_VERSION}"
          "$JENA_HOME/bin/riot" --merge --syntax=JSONLD11 --output=NTRIPLES \
            /tmp/spdx-baseline.jsonld > /tmp/spdx-baseline.nt
          "$JENA_HOME/bin/riot" --merge --syntax=JSONLD11 --output=NTRIPLES \
            /tmp/spdx-semantic-invalid.jsonld > /tmp/spdx-semantic-invalid.nt
          test -s /tmp/spdx-baseline.nt
          test -s /tmp/spdx-semantic-invalid.nt

          # Regression against the original lossy quad->triple harness.
          grep 'createdBy' /tmp/spdx-baseline.nt \
            | grep -q 'urn:worldshepherd:spdx:person:validator'
          grep 'createdBy' /tmp/spdx-semantic-invalid.nt \
            | grep -q 'urn:worldshepherd:spdx:package:validator'
          grep 'software_Package' /tmp/spdx-semantic-invalid.nt \
            | grep -q 'urn:worldshepherd:spdx:package:validator'
          grep 'CreationInfo' /tmp/spdx-semantic-invalid.nt >/dev/null

      - name: Record Jena result against canonical SPDX model
        run: |
          set -euo pipefail
          JENA_HOME="/tmp/apache-jena-${JENA_VERSION}"
          "$JENA_HOME/bin/shacl" validate --text \
            --shapes /tmp/spdx-3.0.1-model.ttl \
            --data /tmp/spdx-baseline.nt \
            > /tmp/jena-spdx-baseline.log
          grep -qx 'Conforms' /tmp/jena-spdx-baseline.log

          "$JENA_HOME/bin/shacl" validate --text \
            --shapes /tmp/spdx-3.0.1-model.ttl \
            --data /tmp/spdx-semantic-invalid.nt \
            > /tmp/jena-spdx-semantic-invalid.log

      - name: Require pySHACL canonical baseline and negative behavior
        run: |
          set -euo pipefail
          /tmp/ws-pyshacl/bin/pyshacl \
            -f human -df json-ld \
            --shacl /tmp/spdx-3.0.1-model.ttl \
            --ont-graph /tmp/spdx-3.0.1-model.ttl \
            /tmp/spdx-baseline.jsonld \
            > /tmp/pyshacl-baseline.log
          grep -q 'Conforms: True' /tmp/pyshacl-baseline.log

          set +e
          /tmp/ws-pyshacl/bin/pyshacl \
            -f human -df json-ld \
            --shacl /tmp/spdx-3.0.1-model.ttl \
            --ont-graph /tmp/spdx-3.0.1-model.ttl \
            /tmp/spdx-semantic-invalid.jsonld \
            > /tmp/pyshacl-semantic-invalid.log 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -q 'Conforms: False' /tmp/pyshacl-semantic-invalid.log
          grep -q 'Value does not have class' /tmp/pyshacl-semantic-invalid.log

      - name: Build claims-controlled interoperability evidence
        run: |
          set -euo pipefail
          mkdir -p spdx_jena_semantic_evidence_ci
          cp /tmp/jena-control-baseline.log spdx_jena_semantic_evidence_ci/
          cp /tmp/jena-control-negative.log spdx_jena_semantic_evidence_ci/
          cp /tmp/jena-spdx-parsed-shapes.log spdx_jena_semantic_evidence_ci/
          cp /tmp/jena-spdx-baseline.log spdx_jena_semantic_evidence_ci/
          cp /tmp/jena-spdx-semantic-invalid.log spdx_jena_semantic_evidence_ci/
          cp /tmp/pyshacl-baseline.log spdx_jena_semantic_evidence_ci/
          cp /tmp/pyshacl-semantic-invalid.log spdx_jena_semantic_evidence_ci/
          cp /tmp/spdx-baseline.nt spdx_jena_semantic_evidence_ci/
          cp /tmp/spdx-semantic-invalid.nt spdx_jena_semantic_evidence_ci/
          cp /tmp/jena-archive.sha512 spdx_jena_semantic_evidence_ci/
          cp /tmp/java-version.txt spdx_jena_semantic_evidence_ci/
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def digest(path):
              return 'sha256:' + hashlib.sha256(Path(path).read_bytes()).hexdigest()

          jena_negative_conforms = Path('/tmp/jena-spdx-semantic-invalid.log').read_text(encoding='utf-8').strip() == 'Conforms'
          if jena_negative_conforms:
              state = 'CANONICAL_SPDX_MODEL_SEMANTIC_INTEROPERABILITY_DIVERGENCE'
              diversity = False
              agreement = False
              jena_negative = 'CONFORMS'
              divergence = True
          else:
              state = 'EXACT_CONTROL_SEMANTIC_ENGINE_AGREEMENT'
              diversity = True
              agreement = True
              jena_negative = 'REJECTED'
              divergence = False

          parsed_shapes = Path('/tmp/jena-spdx-parsed-shapes.log').read_text(encoding='utf-8')
          record = {
              'schema': 'WS-SPDX-JENA-SEMANTIC-INTEROPERABILITY-EVIDENCE-V1',
              'source_head_sha': os.environ['PR_HEAD_SHA'],
              'spdx_version': '3.0.1',
              'canonical_model_sha256': digest('/tmp/spdx-3.0.1-model.ttl'),
              'baseline_jsonld_sha256': digest('/tmp/spdx-baseline.jsonld'),
              'semantic_negative_jsonld_sha256': digest('/tmp/spdx-semantic-invalid.jsonld'),
              'jena_merged_baseline_graph_sha256': digest('/tmp/spdx-baseline.nt'),
              'jena_merged_semantic_negative_graph_sha256': digest('/tmp/spdx-semantic-invalid.nt'),
              'quad_merge_required_for_jena_jsonld_projection': True,
              'jena_core_class_constraint_microcontrol_proven': True,
              'jena_parsed_createdby_agent_constraint': ('createdBy' in parsed_shapes and 'Agent' in parsed_shapes),
              'engines': [
                  {
                      'name': 'Apache Jena SHACL',
                      'version': os.environ['JENA_VERSION'],
                      'language_lineage': 'Java / Apache Jena',
                      'microcontrol_negative': 'REJECTED',
                      'spdx_baseline': 'CONFORMS',
                      'spdx_semantic_negative': jena_negative,
                  },
                  {
                      'name': 'pySHACL',
                      'version': os.environ['PYSHACL_VERSION'],
                      'language_lineage': 'Python / RDFLib',
                      'spdx_baseline': 'CONFORMS',
                      'spdx_semantic_negative': 'REJECTED',
                  },
              ],
              'evidence_state': state,
              'semantic_engine_diversity_established_for_exact_control': diversity,
              'canonical_spdx_model_semantic_agreement_established': agreement,
              'canonical_spdx_model_interoperability_divergence_detected': divergence,
              'jena_is_spdx_recommended_validator': False,
              'general_spdx_conformance_established': False,
              'arbitrary_input_conformance_established': False,
              'independent_external_validation_established': False,
              'community_endorsement_established': False,
              'release_artifact_pgp_signature_verified': False,
              'admission_authorized': False,
              'release_approved': False,
              'claims_boundary': (
                  'Jena independently proves sh:class enforcement on a minimal control and parses createdBy/Agent '
                  'content from the canonical SPDX model. The result then records, rather than hides, whether '
                  'Jena and pySHACL agree on the exact SPDX createdBy wrong-range mutation. A divergence does not '
                  'establish engine diversity for the SPDX control and is standards-interoperability evidence only.'
              ),
          }
          out = Path('spdx_jena_semantic_evidence_ci/jena-semantic-interoperability.json')
          out.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python -m json.tool spdx_jena_semantic_evidence_ci/jena-semantic-interoperability.json >/dev/null

      - name: Enforce claims and diagnostic boundaries
        run: |
          set -euo pipefail
          evidence='spdx_jena_semantic_evidence_ci/jena-semantic-interoperability.json'
          grep -q '"jena_core_class_constraint_microcontrol_proven": true' "$evidence"
          grep -q '"jena_parsed_createdby_agent_constraint": true' "$evidence"
          grep -q '"quad_merge_required_for_jena_jsonld_projection": true' "$evidence"
          grep -q '"jena_is_spdx_recommended_validator": false' "$evidence"
          grep -q '"general_spdx_conformance_established": false' "$evidence"
          grep -q '"arbitrary_input_conformance_established": false' "$evidence"
          grep -q '"independent_external_validation_established": false' "$evidence"
          grep -q '"community_endorsement_established": false' "$evidence"
          grep -q '"release_artifact_pgp_signature_verified": false' "$evidence"
          grep -q '"admission_authorized": false' "$evidence"
          grep -q '"release_approved": false' "$evidence"
          python - "$evidence" <<'PY'
          import json
          import sys
          from pathlib import Path
          record = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          allowed = {
              'EXACT_CONTROL_SEMANTIC_ENGINE_AGREEMENT',
              'CANONICAL_SPDX_MODEL_SEMANTIC_INTEROPERABILITY_DIVERGENCE',
          }
          if record['evidence_state'] not in allowed:
              raise SystemExit(f"unexpected evidence state: {record['evidence_state']}")
          if record['canonical_spdx_model_interoperability_divergence_detected']:
              assert record['semantic_engine_diversity_established_for_exact_control'] is False
              assert record['canonical_spdx_model_semantic_agreement_established'] is False
          else:
              assert record['semantic_engine_diversity_established_for_exact_control'] is True
              assert record['canonical_spdx_model_semantic_agreement_established'] is True
          PY

      - name: Upload Jena semantic interoperability evidence
        uses: actions/upload-artifact@v4
        with:
          name: spdx-jena-semantic-interoperability-evidence
          path: spdx_jena_semantic_evidence_ci
          if-no-files-found: error
