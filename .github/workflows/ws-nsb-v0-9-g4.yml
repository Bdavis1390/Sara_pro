name: WS-NSB v0.9 G4 Gate

on:
  pull_request:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g4_solver.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g4_cli.py'
      - 'deployments/sara_verified_local_v1/tests/test_nsb_g4_solver.py'
      - 'deployments/sara_verified_local_v1/docs/WS_NSB_V0_9_G4_CROSS_SOLVER.md'
      - 'deployments/sara_verified_local_v1/pyproject.toml'
      - '.github/workflows/ws-nsb-v0-9-g4.yml'
  push:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g4_solver.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g4_cli.py'
      - 'deployments/sara_verified_local_v1/tests/test_nsb_g4_solver.py'
      - 'deployments/sara_verified_local_v1/docs/WS_NSB_V0_9_G4_CROSS_SOLVER.md'
      - 'deployments/sara_verified_local_v1/pyproject.toml'
      - '.github/workflows/ws-nsb-v0-9-g4.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: deployments/sara_verified_local_v1

jobs:
  g4-cross-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and tests
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -c constraints-ci.txt -e '.[test]'
          python -m pip check

      - name: Run G4 test suite
        run: python -m pytest tests/test_nsb_g4_solver.py -q

      - name: Execute and verify deterministic G4 report
        run: |
          rm -f ws_nsb_g4_report.json
          ws-nsb-g4 --output ws_nsb_g4_report.json
          ws-nsb-g4 --verify ws_nsb_g4_report.json

      - name: Upload G4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws-nsb-v0-9-g4-report
          path: deployments/sara_verified_local_v1/ws_nsb_g4_report.json
          if-no-files-found: error
