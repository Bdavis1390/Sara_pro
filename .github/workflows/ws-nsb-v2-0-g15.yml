name: WS-NSB v2.0 G15 Gate

on:
  pull_request:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g15_finite_geometry_em.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g15_cli.py'
      - 'deployments/sara_verified_local_v1/tests/test_nsb_g15_finite_geometry_em.py'
      - 'deployments/sara_verified_local_v1/docs/WS_NSB_V2_0_G15_FINITE_GEOMETRY_EM.md'
      - 'deployments/sara_verified_local_v1/pyproject.toml'
      - '.github/workflows/ws-nsb-v2-0-g15.yml'
  push:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g15_finite_geometry_em.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g15_cli.py'
      - 'deployments/sara_verified_local_v1/tests/test_nsb_g15_finite_geometry_em.py'
      - 'deployments/sara_verified_local_v1/docs/WS_NSB_V2_0_G15_FINITE_GEOMETRY_EM.md'
      - 'deployments/sara_verified_local_v1/pyproject.toml'
      - '.github/workflows/ws-nsb-v2-0-g15.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: deployments/sara_verified_local_v1

jobs:
  g15-finite-geometry-em:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and tests
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -c constraints-ci.txt -e '.[test]'
          python -m pip check

      - name: Run G15 test suite
        run: python -m pytest tests/test_nsb_g15_finite_geometry_em.py -q

      - name: Execute and verify deterministic G15 report
        run: |
          rm -f ws_nsb_g15_report.json
          ws-nsb-g15 --output ws_nsb_g15_report.json
          ws-nsb-g15 --verify ws_nsb_g15_report.json

      - name: Upload G15 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws-nsb-v2-0-g15-report
          path: deployments/sara_verified_local_v1/ws_nsb_g15_report.json
          if-no-files-found: error
