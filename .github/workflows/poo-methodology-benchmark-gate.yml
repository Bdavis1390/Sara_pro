name: PoO Methodology Benchmark Gate

on:
  pull_request:
    paths:
      - 'security/poo/**'
      - 'tests/test_poo_*.py'
      - '.github/workflows/poo-methodology-benchmark-gate.yml'
  push:
    branches:
      - 'worldshepherd-poo-methodology-benchmark-*'
    paths:
      - 'security/poo/**'
      - 'tests/test_poo_*.py'
      - '.github/workflows/poo-methodology-benchmark-gate.yml'

permissions:
  contents: read

jobs:
  poo-methodology-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest 'pydantic>=2,<3' cryptography
      - name: Compile PoO and methodology modules
        run: |
          python -m compileall -q security/poo
          python -m py_compile deployments/sara_verified_local_v1/worldshepherd_sara/poo_audit_adapter.py
      - name: Layer 1 — protocol invariants, race model, and exhaustive fail-closed tests
        run: python -m pytest -q tests/test_poo_*.py
      - name: Layer 2 — native SARA integration
        env:
          PYTHONPATH: deployments/sara_verified_local_v1
        run: python -m pytest -q deployments/sara_verified_local_v1/tests/test_poo_audit_adapter.py
      - name: Layer 3 — comparative assurance benchmark
        run: python -m pytest -q tests/test_poo_methodology_benchmark.py
      - name: Layer 4 — shared Python interoperability vectors
        run: python -m pytest -q tests/test_poo_interop_vectors.py
      - name: Layer 4 — JavaScript interoperability reproduction
        run: node security/poo/interop/verify_vectors.mjs
      - name: Enforce methodology claims boundary
        run: |
          grep -q 'BENCHMARK_SCHEMA = "WS-POO-METHODOLOGY-BENCHMARK-V1"' security/poo/methodology_benchmark.py
          grep -q 'STRONGER_ON_SELECTED_DIMENSIONS_ONLY' security/poo/methodology_benchmark.py
          grep -q 'global_superiority_established=False' security/poo/methodology_benchmark.py
          grep -q 'standards_compliance_established=False' security/poo/methodology_benchmark.py
          grep -q 'legal_superiority_established=False' security/poo/methodology_benchmark.py
          grep -q 'global_superiority_established = false' security/poo/METHODOLOGY_BENCHMARK.md
          grep -q 'Known areas where PoO V3 is not yet stronger' security/poo/METHODOLOGY_BENCHMARK.md
          grep -q 'INTERNAL_SECOND_LANGUAGE_REPRODUCTION_NOT_INDEPENDENT_EXTERNAL_VALIDATION' security/poo/interop/poo_v3_vectors.json
          grep -q 'independent_external_validation: false' security/poo/interop/verify_vectors.mjs
