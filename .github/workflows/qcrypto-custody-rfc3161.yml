name: QCRYPTO Custody RFC3161 Timestamp

on:
  push:
    paths:
      - '.github/workflows/qcrypto-custody-rfc3161.yml'
      - 'proof/qcrypto/v1-mainline/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_BUNDLE_SHA256: 3ac4b9d6a94c50dad951ed5c33446ccaaffc876b9d9ad398aefe2a6b7e472522
  TSA_URL: http://timestamp.digicert.com
  DIGICERT_RESPONDER_URL: https://knowledge.digicert.com/content/dam/kb/attachments/time-stamp/DigiCertSHA256RSA4096TimestampResponder20251.cer
  DIGICERT_INTERMEDIATE_URL: https://knowledge.digicert.com/content/dam/kb/attachments/time-stamp/DigiCertTrustedG4TimeStampingRSA4096SHA2562025CA1.pem
  DIGICERT_ROOT_URL: https://knowledge.digicert.com/content/dam/kb/attachments/time-stamp/DigiCertTrustedRootG4.cer

jobs:
  rfc3161-timestamp:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create RFC3161 query for frozen bundle digest
        run: |
          set -euo pipefail
          mkdir -p rfc3161-evidence
          openssl ts -query \
            -digest "$FROZEN_BUNDLE_SHA256" \
            -sha256 \
            -cert \
            -out rfc3161-evidence/request.tsq
          openssl ts -query \
            -in rfc3161-evidence/request.tsq \
            -text \
            > rfc3161-evidence/request.txt

      - name: Obtain external DigiCert timestamp response
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 3 \
            -H 'Content-Type: application/timestamp-query' \
            -H 'Accept: application/timestamp-reply' \
            --data-binary @rfc3161-evidence/request.tsq \
            "$TSA_URL" \
            --output rfc3161-evidence/response.tsr
          test -s rfc3161-evidence/response.tsr
          openssl ts -reply \
            -in rfc3161-evidence/response.tsr \
            -text \
            > rfc3161-evidence/response.txt
          grep -Eq 'Status: Granted|Status: Granted with mods' rfc3161-evidence/response.txt
          grep -F 'Hash Algorithm: sha256' rfc3161-evidence/response.txt

      - name: Download and normalize DigiCert published timestamping chain
        run: |
          set -euo pipefail
          curl --fail --show-error --silent "$DIGICERT_RESPONDER_URL" \
            --output rfc3161-evidence/responder.download
          curl --fail --show-error --silent "$DIGICERT_INTERMEDIATE_URL" \
            --output rfc3161-evidence/intermediate.download
          curl --fail --show-error --silent "$DIGICERT_ROOT_URL" \
            --output rfc3161-evidence/root.download

          normalize_cert() {
            input="$1"
            output="$2"
            if openssl x509 -in "$input" -out "$output" >/dev/null 2>&1; then
              return 0
            fi
            openssl x509 -inform DER -in "$input" -out "$output"
          }

          normalize_cert rfc3161-evidence/responder.download rfc3161-evidence/responder.pem
          normalize_cert rfc3161-evidence/intermediate.download rfc3161-evidence/intermediate.pem
          normalize_cert rfc3161-evidence/root.download rfc3161-evidence/root.pem

          openssl x509 -in rfc3161-evidence/responder.pem -noout -subject -issuer -serial \
            > rfc3161-evidence/responder-cert.txt
          openssl x509 -in rfc3161-evidence/intermediate.pem -noout -subject -issuer -serial \
            > rfc3161-evidence/intermediate-cert.txt
          openssl x509 -in rfc3161-evidence/root.pem -noout -subject -issuer -serial \
            > rfc3161-evidence/root-cert.txt

          # The TSA response carries the responder leaf certificate. OpenSSL's
          # -untrusted input should therefore contain only the issuing CA chain,
          # not the non-CA responder leaf.
          cp rfc3161-evidence/intermediate.pem rfc3161-evidence/untrusted-chain.pem

          openssl verify \
            -CAfile rfc3161-evidence/root.pem \
            rfc3161-evidence/intermediate.pem \
            | tee rfc3161-evidence/intermediate-verify.txt
          grep -F ': OK' rfc3161-evidence/intermediate-verify.txt

          openssl verify \
            -CAfile rfc3161-evidence/root.pem \
            -untrusted rfc3161-evidence/intermediate.pem \
            rfc3161-evidence/responder.pem \
            | tee rfc3161-evidence/responder-verify.txt
          grep -F ': OK' rfc3161-evidence/responder-verify.txt

      - name: Cryptographically verify timestamp response
        run: |
          set -euo pipefail
          openssl ts -verify \
            -digest "$FROZEN_BUNDLE_SHA256" \
            -in rfc3161-evidence/response.tsr \
            -CAfile rfc3161-evidence/root.pem \
            -untrusted rfc3161-evidence/untrusted-chain.pem \
            | tee rfc3161-evidence/verification.txt
          grep -F 'Verification: OK' rfc3161-evidence/verification.txt

      - name: Build timestamp custody receipt
        env:
          GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          evidence = Path('rfc3161-evidence')
          response_text = (evidence / 'response.txt').read_text(encoding='utf-8')
          request_text = (evidence / 'request.txt').read_text(encoding='utf-8')
          verification_text = (evidence / 'verification.txt').read_text(encoding='utf-8')

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def field(pattern: str) -> str:
              match = re.search(pattern, response_text, re.MULTILINE)
              if not match:
                  raise SystemExit(f'missing RFC3161 response field: {pattern}')
              return match.group(1).strip()

          if 'Verification: OK' not in verification_text:
              raise SystemExit('OpenSSL timestamp verification did not succeed')
          hex_pairs = re.findall(r'\b[0-9a-fA-F]{2}\b', request_text)
          rendered = ''.join(hex_pairs).lower()
          if os.environ['FROZEN_BUNDLE_SHA256'] not in request_text.replace(' ', '').replace(':', '').lower() and os.environ['FROZEN_BUNDLE_SHA256'] not in rendered:
              raise SystemExit('timestamp request does not contain frozen bundle digest')

          receipt = {
              'schema': 'WS-QCRYPTO-RFC3161-CUSTODY-RECEIPT-V1',
              'status': 'PASS',
              'external_timestamp_verified': True,
              'frozen_bundle_sha256': os.environ['FROZEN_BUNDLE_SHA256'],
              'tsa_url': os.environ['TSA_URL'],
              'tsa_provider': 'DigiCert',
              'timestamp_time_utc': field(r'^Time stamp:\s*(.+)$'),
              'serial_number': field(r'^Serial number:\s*(.+)$'),
              'policy_oid': field(r'^Policy OID:\s*(.+)$'),
              'request_sha256': sha256(evidence / 'request.tsq'),
              'response_sha256': sha256(evidence / 'response.tsr'),
              'response_text_sha256': sha256(evidence / 'response.txt'),
              'responder_certificate_sha256': sha256(evidence / 'responder.pem'),
              'intermediate_certificate_sha256': sha256(evidence / 'intermediate.pem'),
              'root_certificate_sha256': sha256(evidence / 'root.pem'),
              'github_repository': os.environ['GITHUB_REPOSITORY_VALUE'],
              'workflow_commit': os.environ['GITHUB_SHA_VALUE'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID_VALUE']),
              'verification': 'OPENSSL_TS_VERIFY_OK',
              'claims_boundary': (
                  'This receipt establishes a cryptographically verified RFC3161 timestamp over the '
                  'frozen portable proof-bundle SHA-256. It does not constitute a personal signature, '
                  'does not retroactively sign historical commits, and does not establish technical '
                  'correctness, patent priority, Federal compliance, or third-party technical validation.'
              ),
          }
          (evidence / 'receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Re-verify frozen digest and receipt invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('rfc3161-evidence/receipt.json').read_text(encoding='utf-8'))
          assert receipt['schema']=='WS-QCRYPTO-RFC3161-CUSTODY-RECEIPT-V1'
          assert receipt['status']=='PASS'
          assert receipt['external_timestamp_verified'] is True
          assert receipt['frozen_bundle_sha256']=='3ac4b9d6a94c50dad951ed5c33446ccaaffc876b9d9ad398aefe2a6b7e472522'
          assert receipt['tsa_provider']=='DigiCert'
          assert receipt['verification']=='OPENSSL_TS_VERIFY_OK'
          boundary=receipt['claims_boundary'].lower()
          for phrase in ('does not constitute a personal signature','does not retroactively sign','patent priority','third-party technical validation'):
              assert phrase in boundary
          PY

      - name: Upload external timestamp evidence
        uses: actions/upload-artifact@v4
        with:
          name: qcrypto-rfc3161-timestamp-evidence
          path: rfc3161-evidence/
          if-no-files-found: error
