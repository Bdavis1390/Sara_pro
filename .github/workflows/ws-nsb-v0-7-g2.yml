name: WS-NSB v0.7 G2 Gate

on:
  pull_request:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g2_solver.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g2_cli.py'
      - 'deployments/sara_verified_local_v1/tests/test_nsb_g2_solver.py'
      - 'deployments/sara_verified_local_v1/docs/WS_NSB_V0_7_G2_INTEGRATOR.md'
      - 'deployments/sara_verified_local_v1/pyproject.toml'
      - '.github/workflows/ws-nsb-v0-7-g2.yml'
  push:
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g2_solver.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/nsb_g2_cli.py'
      - 'deployments/sara_verified_local_v1/tests/test_nsb_g2_solver.py'
      - 'deployments/sara_verified_local_v1/docs/WS_NSB_V0_7_G2_INTEGRATOR.md'
      - 'deployments/sara_verified_local_v1/pyproject.toml'
      - '.github/workflows/ws-nsb-v0-7-g2.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: deployments/sara_verified_local_v1

jobs:
  g2-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and tests
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -c constraints-ci.txt -e '.[test]'
          python -m pip check

      - name: Run G2 test suite
        run: python -m pytest tests/test_nsb_g2_solver.py -q

      - name: Execute and verify deterministic G2 report
        run: |
          rm -f ws_nsb_g2_report.json
          ws-nsb-g2 --output ws_nsb_g2_report.json
          ws-nsb-g2 --verify ws_nsb_g2_report.json

      - name: Upload G2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws-nsb-v0-7-g2-report
          path: deployments/sara_verified_local_v1/ws_nsb_g2_report.json
          if-no-files-found: error
