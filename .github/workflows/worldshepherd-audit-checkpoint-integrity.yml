name: Worldshepherd Audit Checkpoint Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - worldshepherd-capture-engine-v1-1
    paths:
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/audit_checkpoint.py'
      - 'deployments/sara_verified_local_v1/worldshepherd_sara/audit_checkpoint_verify.py'
      - 'deployments/sara_verified_local_v1/tests/test_audit_checkpoint.py'
      - 'tools/selection_demo/audit_checkpoint_adversarial_demo.py'
      - '.github/workflows/worldshepherd-audit-checkpoint-integrity.yml'

permissions:
  contents: read

jobs:
  signed-audit-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SARA test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'deployments/sara_verified_local_v1[test]'

      - name: Run audit checkpoint adversarial regression tests
        run: |
          python -m pytest \
            deployments/sara_verified_local_v1/tests/test_audit_checkpoint.py \
            deployments/sara_verified_local_v1/tests/test_storage_tail.py \
            deployments/sara_verified_local_v1/tests/test_echo_checkpoint.py

      - name: Produce structured adversarial evidence
        run: |
          mkdir -p audit_checkpoint_evidence
          python tools/selection_demo/audit_checkpoint_adversarial_demo.py \
            --out audit_checkpoint_evidence/sara-audit-checkpoint-adversarial-evidence.json \
            --software-commit "$GITHUB_SHA"

      - name: Upload audit checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldshepherd-audit-checkpoint-integrity-${{ github.sha }}
          path: audit_checkpoint_evidence/
          if-no-files-found: error
          retention-days: 30
