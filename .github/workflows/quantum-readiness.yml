name: Quantum Readiness CI

on:
  pull_request:
    paths:
      - "worldshepherd_sara/quantum_readiness.py"
      - "worldshepherd_sara/quantum_qiskit.py"
      - "worldshepherd_sara/quantum_evidence.py"
      - "worldshepherd_sara/quantum_resource.py"
      - "worldshepherd_sara/quantum_ibm.py"
      - "worldshepherd_sara/quantum_sara_bridge.py"
      - "worldshepherd_sara/quantum_optimization.py"
      - "worldshepherd_sara/quantum_mission_readiness.py"
      - "worldshepherd_sara/pqc_inventory.py"
      - "scripts/generate_quantum_evidence.py"
      - "scripts/generate_quantum_application_benchmarks.py"
      - "scripts/generate_quantum_mission_readiness.py"
      - "scripts/scan_pqc_inventory.py"
      - "scripts/run_ibm_qpu_bell.py"
      - "tests/test_quantum_*.py"
      - "tests/test_pqc_inventory.py"
      - "requirements-quantum.txt"
      - "benchmarks/quantum/**"
      - "data/quantum_project_matrix.json"
      - "data/pqc_migration_inventory.json"
      - "data/quantum_application_benchmarks.json"
      - "docs/QUANTUM_READINESS_FABRIC.md"
      - "docs/QUANTUM_READINESS_STATUS_2026-08-17.md"
      - ".github/workflows/quantum-readiness.yml"
  push:
    branches:
      - "agent/quantum-readiness-fabric"
    paths:
      - "worldshepherd_sara/quantum_readiness.py"
      - "worldshepherd_sara/quantum_qiskit.py"
      - "worldshepherd_sara/quantum_evidence.py"
      - "worldshepherd_sara/quantum_resource.py"
      - "worldshepherd_sara/quantum_ibm.py"
      - "worldshepherd_sara/quantum_sara_bridge.py"
      - "worldshepherd_sara/quantum_optimization.py"
      - "worldshepherd_sara/quantum_mission_readiness.py"
      - "worldshepherd_sara/pqc_inventory.py"
      - "scripts/generate_quantum_evidence.py"
      - "scripts/generate_quantum_application_benchmarks.py"
      - "scripts/generate_quantum_mission_readiness.py"
      - "scripts/scan_pqc_inventory.py"
      - "scripts/run_ibm_qpu_bell.py"
      - "tests/test_quantum_*.py"
      - "tests/test_pqc_inventory.py"
      - "requirements-quantum.txt"
      - "benchmarks/quantum/**"
      - "data/quantum_project_matrix.json"
      - "data/pqc_migration_inventory.json"
      - "data/quantum_application_benchmarks.json"
      - "docs/QUANTUM_READINESS_FABRIC.md"
      - "docs/QUANTUM_READINESS_STATUS_2026-08-17.md"
      - ".github/workflows/quantum-readiness.yml"

jobs:
  quantum-readiness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-quantum.txt

      - name: Install quantum test dependencies
        run: |
          python -m pip install pytest
          python -m pip install -r requirements-quantum.txt

      - name: Compile QRF modules
        run: |
          python -m compileall \
            worldshepherd_sara/quantum_readiness.py \
            worldshepherd_sara/quantum_qiskit.py \
            worldshepherd_sara/quantum_evidence.py \
            worldshepherd_sara/quantum_resource.py \
            worldshepherd_sara/quantum_ibm.py \
            worldshepherd_sara/quantum_sara_bridge.py \
            worldshepherd_sara/quantum_optimization.py \
            worldshepherd_sara/quantum_mission_readiness.py \
            worldshepherd_sara/pqc_inventory.py

      - name: Run QRF governance and mission calibration tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_quantum_readiness.py \
            tests/test_quantum_resource.py \
            tests/test_quantum_mission_readiness.py \
            tests/test_pqc_inventory.py

      - name: Run quantum execution, application, and evidence tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_quantum_qiskit.py \
            tests/test_quantum_optimization.py \
            tests/test_quantum_evidence.py \
            tests/test_quantum_ibm.py \
            tests/test_quantum_sara_bridge.py

      - name: Generate governed CI evidence
        env:
          PYTHONPATH: .
        run: |
          python scripts/generate_quantum_evidence.py \
            --output .qrf-artifacts/qrf_bell_001_simulation_evidence.json
          python scripts/generate_quantum_application_benchmarks.py \
            --output .qrf-artifacts/quantum_application_benchmarks.json
          python scripts/generate_quantum_mission_readiness.py \
            --output .qrf-artifacts/quantum_mission_readiness.json
          python scripts/scan_pqc_inventory.py \
            --root . \
            --output .qrf-artifacts/pqc_inventory_scan.json \
            --fail-on-private-key
          python -m json.tool .qrf-artifacts/qrf_bell_001_simulation_evidence.json >/dev/null
          python -m json.tool .qrf-artifacts/quantum_application_benchmarks.json >/dev/null
          python -m json.tool .qrf-artifacts/quantum_mission_readiness.json >/dev/null
          python -m json.tool .qrf-artifacts/pqc_inventory_scan.json >/dev/null

      - name: Verify governed source artifacts
        run: |
          test -s benchmarks/quantum/bell_qasm3.qasm
          test -s benchmarks/quantum/qrf_bell_001.json
          test -s data/quantum_project_matrix.json
          test -s data/pqc_migration_inventory.json
          test -s data/quantum_application_benchmarks.json
          python -m json.tool data/quantum_project_matrix.json >/dev/null
          python -m json.tool data/pqc_migration_inventory.json >/dev/null
          python -m json.tool data/quantum_application_benchmarks.json >/dev/null

      - name: Upload QRF evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qrf-evidence-py${{ matrix.python-version }}
          path: .qrf-artifacts/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
