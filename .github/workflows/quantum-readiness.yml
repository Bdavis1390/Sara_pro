name: Quantum Readiness CI

on:
  pull_request:
    paths:
      - "worldshepherd_sara/quantum_readiness.py"
      - "tests/test_quantum_readiness.py"
      - "benchmarks/quantum/**"
      - "data/quantum_project_matrix.json"
      - "docs/QUANTUM_READINESS_FABRIC.md"
      - ".github/workflows/quantum-readiness.yml"
  push:
    branches:
      - "agent/quantum-readiness-fabric"
    paths:
      - "worldshepherd_sara/quantum_readiness.py"
      - "tests/test_quantum_readiness.py"
      - "benchmarks/quantum/**"
      - "data/quantum_project_matrix.json"
      - "docs/QUANTUM_READINESS_FABRIC.md"
      - ".github/workflows/quantum-readiness.yml"

jobs:
  quantum-readiness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner
        run: python -m pip install pytest

      - name: Compile QRF module
        run: python -m compileall worldshepherd_sara/quantum_readiness.py

      - name: Run QRF governance tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_quantum_readiness.py

      - name: Verify benchmark artifacts exist
        run: |
          test -s benchmarks/quantum/bell_qasm3.qasm
          test -s benchmarks/quantum/qrf_bell_001.json
          test -s data/quantum_project_matrix.json
