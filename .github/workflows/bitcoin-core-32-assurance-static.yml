name: Bitcoin Core 32 Assurance Static Gate

on:
  pull_request:
    paths:
      - 'external_anchor_pilots/bitcoin_core_32_assurance_benchmark.md'
      - 'external_anchor_pilots/bitcoin_core_32_psbt_probe.py'
      - 'tests/test_bitcoin_core_32_psbt_probe.py'
      - '.github/workflows/bitcoin-core-32-assurance-static.yml'
  push:
    branches:
      - 'worldshepherd/bitcoin-core-32-assurance'
    paths:
      - 'external_anchor_pilots/bitcoin_core_32_assurance_benchmark.md'
      - 'external_anchor_pilots/bitcoin_core_32_psbt_probe.py'
      - 'tests/test_bitcoin_core_32_psbt_probe.py'
      - '.github/workflows/bitcoin-core-32-assurance-static.yml'

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile probe
        run: python -m py_compile external_anchor_pilots/bitcoin_core_32_psbt_probe.py
      - name: Test probe helpers and upstream pin
        run: python -m unittest -v tests/test_bitcoin_core_32_psbt_probe.py
      - name: Reject merge-conflict markers
        run: |
          set -euo pipefail
          ! grep -R -n -E '^(<<<<<<< |>>>>>>> )' \
            external_anchor_pilots/bitcoin_core_32_assurance_benchmark.md \
            external_anchor_pilots/bitcoin_core_32_psbt_probe.py \
            tests/test_bitcoin_core_32_psbt_probe.py
      - name: Whitespace check
        run: git diff --check origin/main...HEAD
