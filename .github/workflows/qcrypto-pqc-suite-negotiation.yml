name: QCRYPTO PQC Suite Negotiation Gate

on:
  pull_request:
    paths:
      - 'security/qcrypto/pqc_algorithm_policy.py'
      - 'security/qcrypto/pqc_suite_negotiation_guard.py'
      - 'tests/test_qcrypto_pqc_suite_negotiation_guard.py'
      - 'scripts/qcrypto_pqc_suite_negotiation_evidence.py'
      - '.github/workflows/qcrypto-pqc-suite-negotiation.yml'
  push:
    branches:
      - worldshepherd-qcrypto-width-time-risk-v1
    paths:
      - 'security/qcrypto/pqc_algorithm_policy.py'
      - 'security/qcrypto/pqc_suite_negotiation_guard.py'
      - 'tests/test_qcrypto_pqc_suite_negotiation_guard.py'
      - 'scripts/qcrypto_pqc_suite_negotiation_evidence.py'
      - '.github/workflows/qcrypto-pqc-suite-negotiation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pqc-suite-negotiation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile suite negotiation controls
        run: |
          python -m compileall \
            security/qcrypto/pqc_algorithm_policy.py \
            security/qcrypto/pqc_suite_negotiation_guard.py \
            scripts/qcrypto_pqc_suite_negotiation_evidence.py

      - name: Run suite negotiation regressions
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_qcrypto_pqc_suite_negotiation_guard.py

      - name: Generate bounded suite negotiation evidence
        env:
          PYTHONPATH: .
        run: |
          python scripts/qcrypto_pqc_suite_negotiation_evidence.py \
            --output pqc-suite-negotiation-evidence.json

      - name: Assert downgrade-resistant posture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence=json.loads(Path('pqc-suite-negotiation-evidence.json').read_text())
          assert evidence['schema']=='WS-QCRYPTO-PQC-SUITE-NEGOTIATION-EVIDENCE-V1'
          assert evidence['status']=='PASS'
          r=evidence['results']
          assert r['STRONGEST_ACCEPT']['verdict']=='SUITE_NEGOTIATION_ACCEPTED'
          assert r['WEAKER_SELECTION_REJECT']['verdict']=='SUITE_DOWNGRADE_REJECTED'
          assert r['UNKNOWN_SUITE_REJECT']['accepted'] is False
          assert r['PQ_FLOOR_REJECTS_HYBRID_ONLY']['accepted'] is False
          s=evidence['summary']
          assert s['strongest_offered_suite_accepted'] is True
          assert s['weaker_selection_rejected'] is True
          assert s['unknown_suite_rejected'] is True
          assert s['pq_floor_rejects_hybrid_only'] is True
          assert s['transcript_digest_present'] is True
          assert s['execution_authority'] is False
          assert s['live_value_authorized'] is False
          assert s['transaction_authorized'] is False
          assert s['production_deployment_established'] is False
          assert len(evidence['evidence_sha256'])==64
          print('pqc_suite_negotiation_gate: PASS')
          print('evidence_sha256:', evidence['evidence_sha256'])
          PY

      - name: Upload PQC suite negotiation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws-qcrypto-pqc-suite-negotiation-evidence
          path: pqc-suite-negotiation-evidence.json
          if-no-files-found: error
