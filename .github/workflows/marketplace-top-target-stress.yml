name: Marketplace Top Target Synthetic Stress

on:
  push:
    branches:
      - main
      - 'readiness/**'
    paths:
      - 'marketplace/top_target_solution_packages.v1.json'
      - 'marketplace/synthetic_top_target_stress.py'
      - '.github/workflows/marketplace-top-target-stress.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'marketplace/top_target_solution_packages.v1.json'
      - 'marketplace/synthetic_top_target_stress.py'
      - '.github/workflows/marketplace-top-target-stress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile suite
        run: python -m py_compile marketplace/synthetic_top_target_stress.py
      - name: Run deterministic multi-target stress
        run: python marketplace/synthetic_top_target_stress.py --output marketplace/evidence/top-target-synthetic-stress-report.json
      - name: Verify exact synthetic results and zero external gate effect
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('marketplace/evidence/top-target-synthetic-stress-report.json').read_text())
          assert r['result']=='PASS'
          assert r['target_count']==8
          assert r['fixture_count']==72
          assert r['pass_count']==72
          assert all(v=='none' for v in r['external_gate_updates'].values())
          assert r['contact_gate_effect']=='NONE'
          assert all(v['fixture_count']==9 and v['pass_count']==9 for v in r['by_target'].values())
          print(json.dumps({
            'result':r['result'],
            'target_count':r['target_count'],
            'fixture_count':r['fixture_count'],
            'pass_count':r['pass_count'],
            'fixtures_sha256':r['fixtures_sha256'],
            'results_sha256':r['results_sha256'],
            'contact_gate_effect':r['contact_gate_effect']
          },indent=2))
          PY
      - name: Hash evidence
        run: |
          sha256sum marketplace/evidence/top-target-synthetic-stress-report.json > marketplace/evidence/TOP_TARGET_STRESS_SHA256SUMS.txt
          cat marketplace/evidence/TOP_TARGET_STRESS_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-top-target-synthetic-stress
          path: |
            marketplace/evidence/top-target-synthetic-stress-report.json
            marketplace/evidence/TOP_TARGET_STRESS_SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: error
