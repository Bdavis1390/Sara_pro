name: Quantum Metasurface UC06 Precalibration Status

on:
  pull_request:
    paths:
      - "worldshepherd_sara/quantum_metasurface_uc06.py"
      - "scripts/generate_quantum_metasurface_uc06_status.py"
      - "tests/test_quantum_metasurface_uc06.py"
      - ".github/workflows/quantum-metasurface-uc06-status.yml"
  push:
    branches:
      - "agent/quantum-readiness-fabric"
    paths:
      - "worldshepherd_sara/quantum_metasurface_uc06.py"
      - "scripts/generate_quantum_metasurface_uc06_status.py"
      - "tests/test_quantum_metasurface_uc06.py"
      - ".github/workflows/quantum-metasurface-uc06-status.yml"

jobs:
  uc06-precalibration-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile bridge and generator
        run: python -m py_compile worldshepherd_sara/quantum_metasurface_uc06.py scripts/generate_quantum_metasurface_uc06_status.py

      - name: Test fail-closed UC06 bridge
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_quantum_metasurface_uc06.py

      - name: Generate retained status artifact
        env:
          PYTHONPATH: .
        run: |
          python scripts/generate_quantum_metasurface_uc06_status.py --output .qrf-uc06/quantum_metasurface_uc06_precalibration_status.json
          python -m json.tool .qrf-uc06/quantum_metasurface_uc06_precalibration_status.json >/dev/null

      - name: Upload UC06 status artifact
        uses: actions/upload-artifact@v4
        with:
          name: qrf-metasurface-uc06-precalibration
          path: .qrf-uc06/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
