name: Required Test and Build

on:
  pull_request:
  push:
    branches:
      - main
      - oss-contrib-2026-09-12

permissions:
  contents: read

jobs:
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile semantic-health reference
        run: python -m compileall -q tools/oss_health

      - name: Run semantic-health regression tests
        working-directory: tools/oss_health
        run: python -m unittest -v test_semantic_health.py

      - name: Install canonical SARA test dependencies
        working-directory: deployments/sara_verified_local_v1
        run: python -m pip install -e '.[test]'

      - name: Test Discord notification and connector security boundaries
        working-directory: deployments/sara_verified_local_v1
        run: python -m pytest -q tests/test_discord_webhook.py tests/test_discord_connector.py

      - name: Test PRIME isolation, signed ECHO witness, and restriction provenance G1-G7
        working-directory: deployments/sara_verified_local_v1
        run: >-
          python -m pytest -q
          tests/test_restriction_provenance.py
          tests/test_restriction_observability.py
          tests/test_restriction_context_policy.py
          tests/test_restriction_authority_binding.py
          tests/test_restriction_10x_security.py
          tests/test_restriction_key_epoch.py
          tests/test_restriction_witness.py
          tests/test_prime_sentinel_authorization.py
          tests/test_restriction_signature.py
          tests/test_prime_signer_isolation.py
          tests/test_restriction_10x_quality.py

      - name: Test ECHO external signer boundary and deployment preflight
        working-directory: deployments/sara_verified_local_v1
        run: >-
          python -m pytest -q
          tests/test_echo_checkpoint.py
          tests/test_echo_checkpoint_signer_boundary.py
          tests/test_aws_kms_checkpoint_signer.py
          tests/test_deployment_preflight.py

      - name: Validate deployment shell entry points
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/sara.sh
          bash -n deployments/sara_verified_local_v1/scripts/deploy_full_stack.sh
          bash -n deployments/sara_verified_local_v1/scripts/verify_full_stack_runtime.sh
          bash scripts/sara.sh help | grep -q 'deploy-full'
          bash scripts/sara.sh help | grep -q 'verify-full'
          bash scripts/sara.sh help | grep -q 'down-full'

      - name: Validate upstream patch artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -d docs/oss_contributions
          test -d docs/oss/patches
          mapfile -d '' patches < <(
            find docs/oss_contributions docs/oss/patches \
              -type f -name '*.patch' -print0 | sort -z
          )
          if (( ${#patches[@]} < 5 )); then
            echo "Expected at least five patch-ready artifacts across OSS patch directories; found ${#patches[@]}" >&2
            exit 1
          fi
          for patch in "${patches[@]}"; do
            test -s "$patch"
            grep -q '^--- a/' "$patch" || {
              echo "Missing old-file patch header in $patch" >&2
              exit 1
            }
            grep -q '^+++ b/' "$patch" || {
              echo "Missing new-file patch header in $patch" >&2
              exit 1
            }
          done

      - name: Reject unresolved merge-conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '^(<<<<<<< |>>>>>>> )' tools/oss_health docs/oss_contributions docs/oss/patches; then
            echo "Unresolved merge-conflict marker found" >&2
            exit 1
          fi

      - name: Check contribution diff for whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          # Stored *.patch files are patch payloads. Lines such as `+ ` and the
          # standard mail-patch separator `-- ` are meaningful patch content and
          # look like trailing whitespace to git when the patch itself is stored
          # as a repository file. Their structure is validated in the dedicated
          # patch-artifact step above; keep diff --check strict for everything else.
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            git diff --check origin/main...HEAD -- . ':(exclude,glob)**/*.patch'
          else
            git diff --check HEAD^ -- . ':(exclude,glob)**/*.patch'
          fi


  full-stack-deploy:
    name: full-stack-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WS_DEPLOY_SECRET_ROOT: ${{ runner.temp }}/worldshepherd-deploy
      WS_DEPLOY_RELEASE_ID: ci-${{ github.sha }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Deploy localhost full stack
        run: bash scripts/sara.sh deploy-full

      - name: Repeat deployment verification
        run: bash scripts/sara.sh verify-full

      - name: Ensure no raw container-inspect evidence is retained
        shell: bash
        run: |
          set -euo pipefail
          if find deployments/sara_verified_local_v1/.deployment-evidence -type f -name '*.inspect.json' -print -quit | grep -q .; then
            echo "Raw docker inspect evidence must not be retained." >&2
            exit 1
          fi

      - name: Scan retained evidence for live SARA bearer values
        shell: bash
        working-directory: deployments/sara_verified_local_v1
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          if grep -R -F -- "${SARA_ADMIN_TOKEN}" .deployment-evidence >/dev/null 2>&1; then
            echo "Administrator bearer token leaked into deployment evidence." >&2
            exit 1
          fi
          if grep -R -F -- "${SARA_RELAY_TOKEN}" .deployment-evidence >/dev/null 2>&1; then
            echo "Relay bearer token leaked into deployment evidence." >&2
            exit 1
          fi

      - name: Upload deployment acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws-verified-local-full-stack-${{ github.sha }}
          path: |
            deployments/sara_verified_local_v1/.deployment-evidence/preflight
            deployments/sara_verified_local_v1/.deployment-evidence/full-stack
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup deployment
        if: always()
        shell: bash
        run: |
          set +e
          cd deployments/sara_verified_local_v1
          docker compose --profile prime-sentinel --profile echo down
          sudo rm -rf "${WS_DEPLOY_SECRET_ROOT}"
          rm -f .env
