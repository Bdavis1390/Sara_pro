name: QPHONON Multimode v0.3 Research Gate

on:
  pull_request:
    paths:
      - 'research/qphonon_multimode/**'
      - '.github/workflows/qphonon-multimode-v03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.12'
            numpy-spec: 'numpy>=1.24,<2'
            label: py312-numpy1
          - python-version: '3.12'
            numpy-spec: 'numpy>=2,<3'
            label: py312-numpy2
          - python-version: '3.13'
            numpy-spec: 'numpy>=2,<3'
            label: py313-numpy2
    defaults:
      run:
        working-directory: research/qphonon_multimode/v0_3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared dependency lane
        run: |
          python -m pip install '${{ matrix.numpy-spec }}' -r requirements.txt
          python -m pip check
      - name: Run multimode physics tests
        run: |
          set -euo pipefail
          mkdir -p results
          python -m unittest discover -s tests -v 2>&1 | tee results/test_report.txt
      - name: Run bounded numerical benchmark
        run: |
          set -euo pipefail
          python run_v03.py 2>&1 | tee results/benchmark_stdout.txt
      - name: Upload reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.x
        with:
          name: qphonon-multimode-v03-${{ matrix.label }}
          path: research/qphonon_multimode/v0_3/results/
          if-no-files-found: warn
          retention-days: 14
