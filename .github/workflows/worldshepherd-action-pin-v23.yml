name: Worldshepherd V23 Action Pin No-Regression

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tools/github_action_pin_audit_v23.py"
      - "tests/test_github_action_pin_audit_v23.py"
      - "security/action-pinning/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tools/github_action_pin_audit_v23.py"
      - "tests/test_github_action_pin_audit_v23.py"
      - "security/action-pinning/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-pin-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Pin test harness
        run: python -m pip install "pytest==8.4.2"

      - name: Self-test audit logic
        run: python -m pytest -q tests/test_github_action_pin_audit_v23.py

      - name: Compare pull-request Action references with protected base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/github_action_pin_audit_v23.py compare \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output action-pin-audit-v23.json

      - name: Inventory main Action references
        if: github.event_name != 'pull_request'
        run: |
          python tools/github_action_pin_audit_v23.py scan \
            --ref "$GITHUB_SHA" \
            --output action-pin-audit-v23.json

      - name: Upload audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worldshepherd-v23-action-pin-audit
          path: action-pin-audit-v23.json
          if-no-files-found: error
          retention-days: 90
