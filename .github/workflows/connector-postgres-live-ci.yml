name: connector-postgres-live-ci

on:
  push:
    branches:
      - "worldshepherd/connectors-postgres-live-ci-v1-*"
  pull_request:
    paths:
      - "worldshepherd_sara/connector_ticket_postgres.py"
      - "worldshepherd_sara/connector_ticket_shared.py"
      - "tests/test_connector_ticket_postgres_live.py"
      - ".github/workflows/connector-postgres-live-ci.yml"
      - "data/worldshepherd_read_ticket_policy.v1.json"

permissions:
  contents: read

jobs:
  postgres-live-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: worldshepherd_ci
          POSTGRES_PASSWORD: worldshepherd_ci_only
          POSTGRES_DB: worldshepherd_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worldshepherd_ci -d worldshepherd_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WORLDSHEPHERD_TEST_POSTGRES_DSN: postgresql://worldshepherd_ci:worldshepherd_ci_only@127.0.0.1:5432/worldshepherd_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check fastapi pytest "psycopg[binary]==3.3.5"
      - name: Compile live Postgres claim path
        run: python -m py_compile worldshepherd_sara/connector_ticket_postgres.py worldshepherd_sara/connector_ticket_shared.py tests/test_connector_ticket_postgres_live.py
      - name: Verify real Postgres contention and reconnect behavior
        run: python -m pytest -q tests/test_connector_ticket_postgres_live.py
