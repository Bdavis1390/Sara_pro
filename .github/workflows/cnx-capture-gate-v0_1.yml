name: CNX Capture Gate v0.1

on:
  pull_request:
    paths:
      - "config/cnx_capture_gates_v0_1.json"
      - "tools/capture_gate.py"
      - "tests/test_cnx_capture_gate_v0_1.py"
      - "docs/capture/CNX_CAPTURE_GATE_V0_1.md"
      - ".github/workflows/cnx-capture-gate-v0_1.yml"
  push:
    branches:
      - main
    paths:
      - "config/cnx_capture_gates_v0_1.json"
      - "tools/capture_gate.py"
      - "tests/test_cnx_capture_gate_v0_1.py"
      - "docs/capture/CNX_CAPTURE_GATE_V0_1.md"
      - ".github/workflows/cnx-capture-gate-v0_1.yml"

permissions:
  contents: read

jobs:
  capture-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile capture gate
        run: python -m py_compile tools/capture_gate.py
      - name: Run bounded unit tests
        run: python -m unittest tests.test_cnx_capture_gate_v0_1 -v
      - name: Confirm expected fail-closed routes
        run: |
          python tools/capture_gate.py SCAR_AOI03_TEAMING
          python tools/capture_gate.py SCAR_AOI03_DIRECT
          python tools/capture_gate.py XTECHSEARCH10_SUBMISSION
          python tools/capture_gate.py DARPA_INFLUENCE_BENCHMARKS_SUBMISSION
      - name: Reject whitespace errors
        run: git diff --check HEAD^ -- . || git diff --check
