[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "worldshepherd-sara"
version = "0.1.0"
description = "Evidence-governed local administration, relay, and PRE qualification service for Worldshepherd SARA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]

[project.scripts]
ws-pre-bloom = "worldshepherd_sara.pre_bloom_cli:main"
ws-bae-geo-screening = "worldshepherd_sara.bae_geo_screening_cli:main"
ws-partner-screening = "worldshepherd_sara.partner_screening_cli:main"
ws-partner-screening-batch = "worldshepherd_sara.partner_screening_cli:batch_main"
ws-partner-screening-verify = "worldshepherd_sara.partner_screening_verify_cli:main"
ws-release-index = "worldshepherd_sara.release_index_cli:main"
ws-release-index-link-intake = "worldshepherd_sara.release_index_intake_link_cli:main"
ws-sbom-evidence = "worldshepherd_sara.sbom_cli:main"
ws-vulnerability-evidence = "worldshepherd_sara.vulnerability_cli:main"
ws-human-triage-ledger = "worldshepherd_sara.human_triage_cli:main"
ws-intake-minimum-ledger = "worldshepherd_sara.intake_minimum_cli:main"
ws-prime-basis-ablation = "worldshepherd_sara.prime_basis_ablation_cli:main"
ws-programmable-boundary-benchmark = "worldshepherd_sara.programmable_boundary_benchmark_cli:main"

[tool.setuptools]
packages = ["worldshepherd_sara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
