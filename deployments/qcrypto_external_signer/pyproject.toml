[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "worldshepherd-qcrypto-external-custody"
version = "0.1.0"
description = "Separately controlled custody-release signer for bounded QCRYPTO handoffs"
requires-python = ">=3.11"
dependencies = ["cryptography>=50,<51"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
aws = ["boto3>=1.40,<2"]

[tool.setuptools]
packages = ["qcrypto_external_signer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
